<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Football 27 3D V4</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#061912;color:white;font-family:Arial,Helvetica,sans-serif;touch-action:none}body{user-select:none}.menu{position:fixed;inset:0;z-index:50;background:linear-gradient(140deg,#06111f,#087242);display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:22px}.menu h1{font-size:clamp(44px,12vw,88px);margin:0 0 12px;text-shadow:0 12px 25px #0008}.menu p{max-width:720px;opacity:.92}.row{display:grid;grid-template-columns:repeat(3,minmax(145px,1fr));gap:12px;width:min(850px,94vw);margin:16px 0}.box{text-align:left;font-weight:900}.box select{margin-top:7px;width:100%;border:0;border-radius:16px;padding:14px;font-weight:900;font-size:16px;background:#f0f0f2;color:#111}.btn{border:0;border-radius:20px;padding:16px 26px;background:#eaff56;color:#06170f;font-weight:1000;font-size:20px;box-shadow:0 12px 25px #0006}.hidden{display:none!important}.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;z-index:30;display:none;justify-content:center;gap:8px;pointer-events:none}.pill{background:#000a;border-radius:999px;padding:9px 14px;font-weight:900;backdrop-filter:blur(8px);pointer-events:auto}.scene{position:fixed;inset:0;perspective:850px;background:radial-gradient(circle at 50% 28%,#0d5d37,#061912 72%);overflow:hidden}.field{position:absolute;left:50%;top:50%;width:820px;height:500px;transform-style:preserve-3d;background:#198b4a;border:5px solid #fff;box-shadow:0 28px 80px #000b}.stripe{position:absolute;top:0;height:100%;width:82px;background:#20a259}.line{position:absolute;background:#fff;border-radius:3px}.mid{left:408px;top:0;width:4px;height:100%}.center{position:absolute;left:340px;top:180px;width:140px;height:140px;border:4px solid #fff;border-radius:50%}.boxL{position:absolute;left:0;top:165px;width:115px;height:170px;border:4px solid #fff;border-left:0}.boxR{position:absolute;right:0;top:165px;width:115px;height:170px;border:4px solid #fff;border-right:0}.goal{position:absolute;top:190px;width:36px;height:120px;background:#ffffff22;border:5px solid #fff;transform:translateZ(18px)}.goal.left{left:-43px}.goal.right{right:-43px}.stand{position:absolute;left:-40px;width:900px;height:34px;background:#123b61;border-radius:8px;box-shadow:0 10px 0 #0d2b47}.stand.top{top:-88px}.stand.bot{bottom:-88px}.player{position:absolute;width:48px;height:92px;transform-style:preserve-3d;transform-origin:50% 92%;z-index:8}.shadow{position:absolute;left:8px;bottom:0;width:36px;height:14px;border-radius:50%;background:#0005;transform:translateZ(-3px)}.body{position:absolute;left:12px;top:28px;width:24px;height:34px;background:var(--kit);border-radius:9px 9px 5px 5px;box-shadow:inset 0 6px #ffffff22,0 4px 6px #0005}.short{position:absolute;left:13px;top:58px;width:22px;height:15px;background:#101018;border-radius:4px}.head{position:absolute;left:12px;top:2px;width:24px;height:24px;border-radius:50%;background:#d9a06f;box-shadow:inset -5px -4px #0002}.hair{position:absolute;left:13px;top:0;width:22px;height:8px;border-radius:9px;background:#1b120c}.arm,.leg,.boot{position:absolute;background:#d9a06f;border-radius:8px;transform-origin:50% 0}.arm{top:31px;width:8px;height:32px}.arm.l{left:4px}.arm.r{right:4px}.leg{top:72px;width:9px;height:25px;background:#111}.leg.l{left:14px}.leg.r{right:14px}.boot{top:94px;width:13px;height:7px;background:#050505}.boot.l{left:10px}.boot.r{right:9px}.name{position:absolute;left:-16px;top:-25px;width:80px;text-align:center;font-size:13px;font-weight:900;text-shadow:0 2px 5px #000}.ball{position:absolute;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#ddd 55%,#111 62%,#fff 68%);box-shadow:0 8px 14px #0008;z-index:9}.mobile{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:35;display:none;justify-content:space-between;padding:0 22px;pointer-events:none}.stick{width:126px;height:126px;border-radius:50%;background:#ffffff2a;border:2px solid #ffffff55;position:relative;pointer-events:auto}.knob{width:54px;height:54px;border-radius:50%;background:#ffffffe0;position:absolute;left:36px;top:36px}.actions{display:flex;gap:12px;align-items:end;pointer-events:auto}.round{width:86px;height:86px;border-radius:50%;border:0;background:#eaff56;color:#06170f;font-weight:1000}.info{font-size:13px;opacity:.8;margin-top:14px}@media(max-width:700px){.row{grid-template-columns:1fr}.pill{font-size:12px;padding:8px 10px}.round{width:78px;height:78px}.stick{width:116px;height:116px}.knob{left:31px;top:31px}}
</style>
</head>
<body>
<div class="scene"><div id="field" class="field"><div class="stand top"></div><div class="stand bot"></div><div class="stripe" style="left:0"></div><div class="stripe" style="left:164px"></div><div class="stripe" style="left:328px"></div><div class="stripe" style="left:492px"></div><div class="stripe" style="left:656px"></div><div class="line mid"></div><div class="center"></div><div class="boxL"></div><div class="boxR"></div><div class="goal left"></div><div class="goal right"></div><div id="ball" class="ball"></div></div></div>
<div id="menu" class="menu"><h1>Football 27 3D</h1><p>V4 corrigée : le bouton fonctionne, un seul terrain, joueurs 3D stylisés avec tête, corps, bras, jambes, chaussures et animation de course.</p><div class="row"><label class="box">Ton pays<select id="home"></select></label><label class="box">Adversaire<select id="away"></select></label><label class="box">Difficulté<select id="diff"><option value="0.75">Facile</option><option value="1" selected>Normal</option><option value="1.25">Difficile</option></select></label></div><button id="play" class="btn">Lancer le match 3D</button><p class="info">iPhone : joystick + Sprint/Tir. PC : ZQSD ou flèches, Shift, Espace.</p></div>
<div id="hud" class="hud"><div class="pill" id="score"></div><div class="pill" id="clock">00:00</div><button class="pill" id="pause">Pause</button></div>
<div id="mobile" class="mobile"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="actions"><button id="sprint" class="round">SPRINT</button><button id="shoot" class="round">TIR</button></div></div>
<script>
(()=>{const $=id=>document.getElementById(id),field=$('field'),ballEl=$('ball'),homeSel=$('home'),awaySel=$('away');const countries=[['France','🇫🇷','#2455e6'],['Brésil','🇧🇷','#f2ce31'],['Argentine','🇦🇷','#74c9ff'],['Portugal','🇵🇹','#c91d2f'],['Espagne','🇪🇸','#e5352e'],['Allemagne','🇩🇪','#eeeeee'],['Italie','🇮🇹','#198754'],['Angleterre','🏴','#ffffff'],['Pays-Bas','🇳🇱','#ff7a1a'],['Belgique','🇧🇪','#111111'],['Maroc','🇲🇦','#c91b2c'],['Sénégal','🇸🇳','#1f9c57'],['Japon','🇯🇵','#ffffff'],['Mexique','🇲🇽','#168b50'],['Algérie','🇩🇿','#15864b'],['Nigeria','🇳🇬','#14884d']];countries.forEach((c,i)=>{homeSel.add(new Option(c[1]+' '+c[0],i));awaySel.add(new Option(c[1]+' '+c[0],i));});homeSel.value=0;awaySel.value=1;let home=countries[0],away=countries[1],diff=1,started=false,paused=false,last=0,t=0,scoreH=0,scoreA=0,players=[],active=null;let ball={x:0,z:0,vx:0,vz:0};let keys=new Set(),joy={x:0,z:0},msprint=false,mshoot=false;function pxX(x){return (x+41)*10}function pxZ(z){return (z+25)*10}function makeEl(p){let e=document.createElement('div');e.className='player';e.style.setProperty('--kit',p.color);e.innerHTML='<div class="shadow"></div><div class="name">'+p.name+'</div><div class="hair"></div><div class="head"></div><div class="body"></div><div class="short"></div><div class="arm l"></div><div class="arm r"></div><div class="leg l"></div><div class="leg r"></div><div class="boot l"></div><div class="boot r"></div>';field.appendChild(e);p.el=e;p.legL=e.querySelector('.leg.l');p.legR=e.querySelector('.leg.r');p.armL=e.querySelector('.arm.l');p.armR=e.querySelector('.arm.r')}function makeTeams(){players.forEach(p=>p.el&&p.el.remove());players=[];let hp=[[-30,0],[-18,-12],[-18,12],[-7,-8],[-7,8],[12,0]],ap=[[30,0],[18,-12],[18,12],[7,-8],[7,8],[-12,0]];hp.forEach((p,i)=>{let o={x:p[0],z:p[1],hx:p[0],hz:p[1],yaw:0,team:0,color:home[2],name:i?'CPU':'MOI',anim:0,speed:11};makeEl(o);players.push(o)});ap.forEach((p,i)=>{let o={x:p[0],z:p[1],hx:p[0],hz:p[1],yaw:Math.PI,team:1,color:away[2],name:i?'ADV':'IA',anim:0,speed:9.5*diff};makeEl(o);players.push(o)});active=players[0]}function resize(){let s=Math.min(innerWidth/940,innerHeight/720);field.style.transform='translate(-50%,-48%) rotateX(62deg) scale('+s+')'}addEventListener('resize',resize);resize();function start(){home=countries[+homeSel.value];away=countries[+awaySel.value];diff=+$('diff').value;scoreH=scoreA=t=0;ball={x:0,z:0,vx:0,vz:0};makeTeams();started=true;paused=false;last=performance.now();$('menu').classList.add('hidden');$('hud').style.display='flex';$('mobile').style.display='flex';requestAnimationFrame(loop)}function input(){let x=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('q')||keys.has('a')?1:0)+joy.x;let z=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('z')||keys.has('w')?1:0)+joy.z;let l=Math.hypot(x,z);if(l>1){x/=l;z/=l}return{x,z,sprint:keys.has('shift')||msprint,shoot:keys.has(' ')||mshoot}}function clamp(p){p.x=Math.max(-39,Math.min(39,p.x));p.z=Math.max(-23,Math.min(23,p.z))}function move(p,tx,tz,dt,sp){let dx=tx-p.x,dz=tz-p.z,l=Math.hypot(dx,dz);if(l>.25){dx/=l;dz/=l;p.x+=dx*sp*dt;p.z+=dz*sp*dt;p.yaw=Math.atan2(dx,dz);p.anim+=dt*sp*2.5;clamp(p)}}function reset(){ball.x=0;ball.z=0;ball.vx=0;ball.vz=0;players.forEach(p=>{p.x=p.hx;p.z=p.hz;p.anim=0});active=players[0]}function update(dt){t+=dt*5.5;let inp=input(),sp=inp.sprint?16:11;if(active&&Math.hypot(inp.x,inp.z)>.03){active.x+=inp.x*sp*dt;active.z+=inp.z*sp*dt;active.yaw=Math.atan2(inp.x,inp.z);active.anim+=dt*sp*2.7;clamp(active)}if(active&&Math.hypot(ball.x-active.x,ball.z-active.z)<2.3){let fx=Math.sin(active.yaw),fz=Math.cos(active.yaw);ball.x=active.x+fx*1.35;ball.z=active.z+fz*1.35;if(inp.shoot){ball.vx=fx*30;ball.vz=fz*30+(Math.random()-.5)*6;mshoot=false;keys.delete(' ')}else{ball.vx+=(fx*4-ball.vx)*.18;ball.vz+=(fz*4-ball.vz)*.18}}players.forEach((p,i)=>{if(p===active)return;if(p.team===0){let k=i>2?0.35:0.15;move(p,p.hx+(ball.x-p.hx)*k,p.hz+(ball.z-p.hz)*k,dt,6.5)}else{let k=i>8?0.75:0.42;move(p,p.hx+(ball.x-p.hx)*k,p.hz+(ball.z-p.hz)*k,dt,p.speed);if(Math.hypot(ball.x-p.x,ball.z-p.z)<2){let ax=-41-p.x,az=(Math.random()-.5)*12-p.z,l=Math.hypot(ax,az)||1;ax/=l;az/=l;ball.x=p.x+ax*1.35;ball.z=p.z+az*1.35;let pow=Math.random()<.05*diff||p.x<3?23*diff:8;ball.vx=ax*pow;ball.vz=az*pow+(Math.random()-.5)*3}}});ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.vx*=.982;ball.vz*=.982;if(Math.abs(ball.z)>24){ball.z=Math.sign(ball.z)*24;ball.vz*=-.7}if(ball.x>41){if(Math.abs(ball.z)<5.7){scoreH++;reset()}else{ball.x=41;ball.vx*=-.6}}if(ball.x<-41){if(Math.abs(ball.z)<5.7){scoreA++;reset()}else{ball.x=-41;ball.vx*=-.6}}}function render(){players.forEach(p=>{let x=pxX(p.x),z=pxZ(p.z),deg=p.yaw*180/Math.PI;p.el.style.left=x+'px';p.el.style.top=z+'px';p.el.style.transform='translate(-50%,-90%) rotateX(-62deg) rotateY('+deg+'deg)';let r=Math.sin(p.anim);p.legL.style.transform='rotateX('+(r*35)+'deg)';p.legR.style.transform='rotateX('+(-r*35)+'deg)';p.armL.style.transform='rotateX('+(-r*28)+'deg)';p.armR.style.transform='rotateX('+(r*28)+'deg)';p.el.style.zIndex=1000+Math.round(z)});ballEl.style.left=(pxX(ball.x)-11)+'px';ballEl.style.top=(pxZ(ball.z)-11)+'px';ballEl.style.transform='translateZ(22px) rotateX(-62deg) rotate('+Math.round(t*260)+'deg)';ballEl.style.zIndex=2000;$('score').textContent=home[1]+' '+home[0]+' '+scoreH+' - '+scoreA+' '+away[0]+' '+away[1];let m=String(Math.floor(t/60)).padStart(2,'0'),s=String(Math.floor(t%60)).padStart(2,'0');$('clock').textContent=m+':'+s}function loop(now){let dt=Math.min((now-last)/1000,.033);last=now;if(started&&!paused)update(dt);render();requestAnimationFrame(loop)}$('play').onclick=start;$('pause').onclick=()=>paused=!paused;addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));let stick=$('stick'),knob=$('knob'),pid=null;function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dz=e.clientY-cy,max=46,l=Math.min(max,Math.hypot(dx,dz)),a=Math.atan2(dz,dx),x=Math.cos(a)*l,z=Math.sin(a)*l;knob.style.transform='translate('+x+'px,'+z+'px)';joy.x=x/max;joy.z=z/max}function stop(){pid=null;joy.x=joy.z=0;knob.style.transform='translate(0,0)'}stick.onpointerdown=e=>{pid=e.pointerId;stick.setPointerCapture(pid);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===pid)moveStick(e)};stick.onpointerup=stop;stick.onpointercancel=stop;$('sprint').onpointerdown=()=>msprint=true;$('sprint').onpointerup=()=>msprint=false;$('sprint').onpointercancel=()=>msprint=false;$('shoot').onpointerdown=()=>mshoot=true;$('shoot').onpointerup=()=>mshoot=false;$('shoot').onpointercancel=()=>mshoot=false;makeTeams();reset();render();})();
</script>
</body>
</html>
