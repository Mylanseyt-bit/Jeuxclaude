<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Ultimate Football 3D</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#06120b; font-family:Arial,sans-serif; touch-action:none; }
    #hud { position:fixed; top:12px; left:50%; transform:translateX(-50%); color:white; background:rgba(0,0,0,.58); padding:10px 18px; border-radius:18px; font-size:18px; font-weight:900; z-index:10; backdrop-filter:blur(8px); text-align:center; }
    #hint { position:fixed; top:68px; left:50%; transform:translateX(-50%); color:#e8ffe8; background:rgba(0,0,0,.42); padding:8px 14px; border-radius:14px; font-size:13px; z-index:10; text-align:center; max-width:92%; }
    #menu { position:fixed; inset:0; background:radial-gradient(circle at top,#1a4b30,#020504); z-index:30; display:flex; align-items:center; justify-content:center; color:white; }
    .card { width:min(92vw,440px); background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.18); border-radius:26px; padding:24px; text-align:center; box-shadow:0 20px 60px rgba(0,0,0,.45); backdrop-filter:blur(14px); }
    .title { font-size:34px; font-weight:1000; margin-bottom:8px; }
    .subtitle { color:#c8ffd3; margin-bottom:20px; line-height:1.4; }
    button { border:none; border-radius:18px; padding:14px 22px; font-size:17px; font-weight:900; cursor:pointer; color:#06220c; background:linear-gradient(135deg,#a8ff78,#78ffd6); box-shadow:0 8px 24px rgba(120,255,214,.25); }
    #mobileControls { position:fixed; inset:0; z-index:20; pointer-events:none; display:none; }
    .stick { position:absolute; left:24px; bottom:34px; width:130px; height:130px; border-radius:50%; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25); pointer-events:auto; }
    .knob { position:absolute; width:54px; height:54px; left:38px; top:38px; border-radius:50%; background:rgba(255,255,255,.78); }
    .action { position:absolute; right:25px; bottom:42px; width:82px; height:82px; border-radius:50%; background:rgba(255,255,255,.18); border:1px solid rgba(255,255,255,.32); color:white; display:flex; align-items:center; justify-content:center; font-weight:1000; font-size:15px; pointer-events:auto; user-select:none; }
    #passBtn { right:120px; bottom:25px; width:66px; height:66px; font-size:13px; }
    @media(max-width:900px){ #mobileControls{display:block;} #hint{display:none;} }
  </style>
</head>
<body>
  <div id="menu"><div class="card"><div class="title">FOOTBALL 3D</div><div class="subtitle">Match 3D jouable : joueur, ballon, IA, buts, score, caméra dynamique et contrôles iPhone.</div><button id="startBtn">Lancer le match</button></div></div>
  <div id="hud">Bleu 0 - 0 Rouge</div>
  <div id="hint">PC : ZQSD/WASD bouger · Souris caméra · Espace tirer · E passer · Shift sprint</div>
  <div id="mobileControls"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="action" id="shootBtn">TIR</div><div class="action" id="passBtn">PASSE</div></div>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js';

    let scene, camera, renderer, clock, started=false;
    const fieldLength=78, fieldWidth=48, goalWidth=12, goalDepth=4;
    let player, playerVelocity=new THREE.Vector3(), ball, ballVelocity=new THREE.Vector3();
    let blueScore=0, redScore=0;
    const keys={}, aiPlayers=[], blueMates=[];
    let cameraYaw=0, cameraPitch=.32, mouseDown=false, lastMouseX=0, lastMouseY=0;
    let mobileMove=new THREE.Vector2(0,0), mobileShoot=false, mobilePass=false;
    const hud=document.getElementById('hud'), menu=document.getElementById('menu');

    document.getElementById('startBtn').addEventListener('click',()=>{menu.style.display='none';started=true;});
    init(); animate();

    function init(){
      clock=new THREE.Clock();
      scene=new THREE.Scene(); scene.background=new THREE.Color(0x8fd6ff); scene.fog=new THREE.Fog(0x8fd6ff,80,190);
      camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,500);
      renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; document.body.appendChild(renderer.domElement);
      createLights(); createStadium(); createField(); createGoals();
      player=createFootballer(0x1e7bff,0xffffff); player.position.set(0,0,12); scene.add(player);
      const mate1=createFootballer(0x1e7bff,0xffffff); mate1.position.set(-12,0,4); scene.add(mate1); blueMates.push(mate1);
      const mate2=createFootballer(0x1e7bff,0xffffff); mate2.position.set(12,0,3); scene.add(mate2); blueMates.push(mate2);
      [[0,-14],[-14,-22],[14,-22]].forEach(p=>{const e=createFootballer(0xff3131,0xffffff); e.position.set(p[0],0,p[1]); scene.add(e); aiPlayers.push(e);});
      ball=createBall(); ball.position.set(0,.45,7); scene.add(ball); createAudience();
      addEventListener('resize',onResize); addEventListener('keydown',e=>keys[e.key.toLowerCase()]=true); addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
      renderer.domElement.addEventListener('mousedown',e=>{mouseDown=true;lastMouseX=e.clientX;lastMouseY=e.clientY;}); addEventListener('mouseup',()=>mouseDown=false);
      addEventListener('mousemove',e=>{ if(!mouseDown)return; const dx=e.clientX-lastMouseX,dy=e.clientY-lastMouseY; lastMouseX=e.clientX; lastMouseY=e.clientY; cameraYaw-=dx*.006; cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.003,.12,.75);});
      setupMobileControls();
    }

    function createLights(){
      scene.add(new THREE.HemisphereLight(0xffffff,0x1f4020,1.7));
      const sun=new THREE.DirectionalLight(0xffffff,2.7); sun.position.set(25,55,25); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048); sun.shadow.camera.left=-80; sun.shadow.camera.right=80; sun.shadow.camera.top=80; sun.shadow.camera.bottom=-80; scene.add(sun);
      [[-34,35,20],[34,35,-20]].forEach(p=>{const l=new THREE.PointLight(0xffffff,550,130); l.position.set(...p); scene.add(l);});
    }

    function createField(){
      const c=document.createElement('canvas'); c.width=c.height=512; const ctx=c.getContext('2d');
      for(let y=0;y<512;y+=32){ctx.fillStyle=y%64===0?'#1c8b3a':'#197d34';ctx.fillRect(0,y,512,32);} for(let i=0;i<6000;i++){ctx.fillStyle=Math.random()>.5?'rgba(255,255,255,.05)':'rgba(0,0,0,.06)';ctx.fillRect(Math.random()*512,Math.random()*512,1,4);}
      const tex=new THREE.CanvasTexture(c); tex.wrapS=tex.wrapT=THREE.RepeatWrapping; tex.repeat.set(6,9);
      const field=new THREE.Mesh(new THREE.PlaneGeometry(fieldWidth,fieldLength),new THREE.MeshStandardMaterial({map:tex,roughness:.95})); field.rotation.x=-Math.PI/2; field.receiveShadow=true; scene.add(field);
      addLine(0,0,fieldWidth,0); addLine(0,fieldLength/2,fieldWidth,fieldLength/2); addLine(0,-fieldLength/2,fieldWidth,-fieldLength/2); addLine(-fieldWidth/2,0,fieldLength,0,true); addLine(fieldWidth/2,0,fieldLength,0,true); addCircle(0,0,6); addBoxLine(0,fieldLength/2-9,24,18); addBoxLine(0,-fieldLength/2+9,24,18); addBoxLine(0,fieldLength/2-4,14,8); addBoxLine(0,-fieldLength/2+4,14,8);
    }
    function addLine(x,z,length,zPos,vertical=false){const geo=vertical?new THREE.BoxGeometry(.18,.035,length):new THREE.BoxGeometry(length,.035,.18); const line=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:0xffffff,roughness:.5})); line.position.set(x,.025,vertical?z:zPos); scene.add(line);}
    function addCircle(x,z,r){const pts=[]; for(let i=0;i<=96;i++){const a=i/96*Math.PI*2; pts.push(new THREE.Vector3(x+Math.cos(a)*r,.04,z+Math.sin(a)*r));} scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff})));}
    function addBoxLine(x,z,w,h){const s=[[-w/2,-h/2],[w/2,-h/2],[w/2,h/2],[-w/2,h/2],[-w/2,-h/2]]; const pts=s.map(p=>new THREE.Vector3(x+p[0],.045,z+p[1])); scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff})));}

    function createGoals(){createGoal(1);createGoal(-1);} function createGoal(side){
      const g=new THREE.Group(), mat=new THREE.MeshStandardMaterial({color:0xffffff,metalness:.2,roughness:.35}), netMat=new THREE.MeshStandardMaterial({color:0xdfffe8,transparent:true,opacity:.22}), z=side*(fieldLength/2+1.2);
      const postGeo=new THREE.BoxGeometry(.35,3.2,.35), barGeo=new THREE.BoxGeometry(goalWidth,.35,.35);
      const l=new THREE.Mesh(postGeo,mat); l.position.set(-goalWidth/2,1.6,z); l.castShadow=true; g.add(l); const r=l.clone(); r.position.x=goalWidth/2; g.add(r); const bar=new THREE.Mesh(barGeo,mat); bar.position.set(0,3.15,z); bar.castShadow=true; g.add(bar);
      const back=new THREE.Mesh(new THREE.BoxGeometry(goalWidth,3,.08),netMat); back.position.set(0,1.5,z+side*goalDepth); g.add(back); const top=new THREE.Mesh(new THREE.BoxGeometry(goalWidth,.08,goalDepth),netMat); top.position.set(0,3.1,z+side*goalDepth/2); g.add(top); scene.add(g);
    }

    function createStadium(){
      const ground=new THREE.Mesh(new THREE.CircleGeometry(130,80),new THREE.MeshStandardMaterial({color:0x103615,roughness:1})); ground.rotation.x=-Math.PI/2; ground.position.y=-.08; ground.receiveShadow=true; scene.add(ground);
      const mat=new THREE.MeshStandardMaterial({color:0x1b1d24,roughness:.8}); for(let i=0;i<4;i++){const st=new THREE.Mesh(new THREE.BoxGeometry(i<2?70:18,7,i<2?10:95),mat); if(i===0)st.position.set(0,3.2,fieldLength/2+18); if(i===1)st.position.set(0,3.2,-fieldLength/2-18); if(i===2)st.position.set(fieldWidth/2+16,3.2,0); if(i===3)st.position.set(-fieldWidth/2-16,3.2,0); st.castShadow=true; scene.add(st);}
    }
    function createAudience(){const colors=[0xff5252,0x4da3ff,0xffffff,0xffdc4d,0x35ff89]; for(let i=0;i<220;i++){const fan=new THREE.Mesh(new THREE.SphereGeometry(.22,8,8),new THREE.MeshStandardMaterial({color:colors[Math.floor(Math.random()*colors.length)]})); const side=Math.floor(Math.random()*4); if(side===0)fan.position.set(THREE.MathUtils.randFloatSpread(65),THREE.MathUtils.randFloat(4,8),fieldLength/2+THREE.MathUtils.randFloat(14,23)); if(side===1)fan.position.set(THREE.MathUtils.randFloatSpread(65),THREE.MathUtils.randFloat(4,8),-fieldLength/2-THREE.MathUtils.randFloat(14,23)); if(side===2)fan.position.set(fieldWidth/2+THREE.MathUtils.randFloat(12,21),THREE.MathUtils.randFloat(4,8),THREE.MathUtils.randFloatSpread(85)); if(side===3)fan.position.set(-fieldWidth/2-THREE.MathUtils.randFloat(12,21),THREE.MathUtils.randFloat(4,8),THREE.MathUtils.randFloatSpread(85)); scene.add(fan);}}

    function createFootballer(shirtColor,shortsColor){
      const g=new THREE.Group(), skin=new THREE.MeshStandardMaterial({color:0xd59b67,roughness:.65}), shirt=new THREE.MeshStandardMaterial({color:shirtColor,roughness:.55}), shorts=new THREE.MeshStandardMaterial({color:shortsColor,roughness:.6}), black=new THREE.MeshStandardMaterial({color:0x111111,roughness:.7}), sock=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.6});
      const body=new THREE.Mesh(new THREE.CapsuleGeometry(.65,1.1,8,16),shirt); body.position.y=1.85; body.castShadow=true; g.add(body);
      const head=new THREE.Mesh(new THREE.SphereGeometry(.42,20,20),skin); head.position.y=2.75; head.castShadow=true; g.add(head); const hair=new THREE.Mesh(new THREE.SphereGeometry(.44,16,16,0,Math.PI*2,0,Math.PI/2),black); hair.position.y=2.95; hair.castShadow=true; g.add(hair);
      const shortsMesh=new THREE.Mesh(new THREE.BoxGeometry(1.15,.5,.58),shorts); shortsMesh.position.y=1.12; shortsMesh.castShadow=true; g.add(shortsMesh);
      const armGeo=new THREE.CapsuleGeometry(.13,.95,6,10), armL=new THREE.Mesh(armGeo,skin); armL.position.set(-.78,1.82,0); armL.rotation.z=.28; armL.castShadow=true; g.add(armL); const armR=armL.clone(); armR.position.x=.78; armR.rotation.z=-.28; g.add(armR);
      const legGeo=new THREE.CapsuleGeometry(.17,.95,6,10), legL=new THREE.Mesh(legGeo,sock); legL.position.set(-.33,.55,0); legL.castShadow=true; g.add(legL); const legR=legL.clone(); legR.position.x=.33; g.add(legR);
      const bootGeo=new THREE.BoxGeometry(.38,.18,.75), bootL=new THREE.Mesh(bootGeo,black); bootL.position.set(-.33,.12,.12); bootL.castShadow=true; g.add(bootL); const bootR=bootL.clone(); bootR.position.x=.33; g.add(bootR); g.userData={speed:0,target:new THREE.Vector3(),anim:Math.random()*100}; return g;
    }

    function createBall(){
      const c=document.createElement('canvas'); c.width=c.height=256; const ctx=c.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,256,256); ctx.fillStyle='#111'; for(let i=0;i<14;i++){const x=Math.random()*256,y=Math.random()*256; ctx.beginPath(); for(let a=0;a<6;a++){const ang=Math.PI*2*a/6,px=x+Math.cos(ang)*18,py=y+Math.sin(ang)*18; if(a===0)ctx.moveTo(px,py); else ctx.lineTo(px,py);} ctx.closePath(); ctx.fill();}
      const b=new THREE.Mesh(new THREE.SphereGeometry(.48,32,32),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(c),roughness:.45,metalness:.05})); b.castShadow=true; return b;
    }

    function setupMobileControls(){
      const stick=document.getElementById('stick'), knob=document.getElementById('knob'), shoot=document.getElementById('shootBtn'), pass=document.getElementById('passBtn'); let active=false,rect;
      stick.addEventListener('touchstart',e=>{active=true;rect=stick.getBoundingClientRect();updateStick(e.touches[0]);},{passive:true}); stick.addEventListener('touchmove',e=>{if(active)updateStick(e.touches[0]);},{passive:true}); stick.addEventListener('touchend',()=>{active=false;mobileMove.set(0,0);knob.style.left='38px';knob.style.top='38px';});
      function updateStick(t){const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2; let dx=t.clientX-cx,dy=t.clientY-cy; const max=46,len=Math.hypot(dx,dy); if(len>max){dx=dx/len*max;dy=dy/len*max;} knob.style.left=`${38+dx}px`; knob.style.top=`${38+dy}px`; mobileMove.set(dx/max,dy/max);}
      shoot.addEventListener('touchstart',()=>mobileShoot=true); shoot.addEventListener('touchend',()=>mobileShoot=false); pass.addEventListener('touchstart',()=>mobilePass=true); pass.addEventListener('touchend',()=>mobilePass=false);
      let lx=0,ly=0,camTouch=false; renderer.domElement.addEventListener('touchstart',e=>{if(e.target.closest('#mobileControls'))return; if(e.touches.length){camTouch=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}},{passive:true}); renderer.domElement.addEventListener('touchmove',e=>{if(!camTouch||!e.touches.length)return; const t=e.touches[0],dx=t.clientX-lx,dy=t.clientY-ly; lx=t.clientX; ly=t.clientY; cameraYaw-=dx*.006; cameraPitch=THREE.MathUtils.clamp(cameraPitch+dy*.003,.12,.75);},{passive:true}); renderer.domElement.addEventListener('touchend',()=>camTouch=false);
    }

    function animate(){requestAnimationFrame(animate); const dt=Math.min(clock.getDelta(),.033); if(started){updatePlayer(dt); updateBlueMates(dt); updateAI(dt); updateBall(dt); updateCamera(dt); checkGoal();} else {camera.position.set(0,28,52); camera.lookAt(0,0,0);} renderer.render(scene,camera);}
    function updatePlayer(dt){
      const forward=new THREE.Vector3(Math.sin(cameraYaw),0,Math.cos(cameraYaw)), right=new THREE.Vector3(Math.cos(cameraYaw),0,-Math.sin(cameraYaw)); let move=new THREE.Vector3();
      if(keys.z||keys.w)move.add(forward); if(keys.s)move.sub(forward); if(keys.q||keys.a)move.sub(right); if(keys.d)move.add(right); if(mobileMove.length()>.05){move.add(forward.clone().multiplyScalar(-mobileMove.y)); move.add(right.clone().multiplyScalar(mobileMove.x));}
      if(move.lengthSq()>0)move.normalize(); const sprint=keys.shift?1.55:1; playerVelocity.lerp(move.multiplyScalar(8.5*sprint),.18); player.position.addScaledVector(playerVelocity,dt); clampToField(player.position);
      if(playerVelocity.length()>.3){const a=Math.atan2(playerVelocity.x,playerVelocity.z); player.rotation.y=THREE.MathUtils.lerpAngle(player.rotation.y,a,.25); animateRun(player,dt,playerVelocity.length());}
      const dist=player.position.distanceTo(ball.position); if(dist<1.55){const cp=player.position.clone().add(new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y)).multiplyScalar(1.25)); ball.position.lerp(new THREE.Vector3(cp.x,.48,cp.z),.32); ballVelocity.multiplyScalar(.75); if(keys[' ']||mobileShoot){shootBall(29);mobileShoot=false;} if(keys.e||mobilePass){passBall();mobilePass=false;}}
    }
    function updateBlueMates(dt){blueMates.forEach((m,i)=>{const target=player.position.clone(); target.x+=i===0?-13:13; target.z+=-8; target.x=THREE.MathUtils.clamp(target.x,-fieldWidth/2+3,fieldWidth/2-3); target.z=THREE.MathUtils.clamp(target.z,-fieldLength/2+3,fieldLength/2-3); moveCharacterToward(m,target,4.3,dt); animateRun(m,dt,4);});}
    function updateAI(dt){aiPlayers.forEach((e,i)=>{let target; const d=e.position.distanceTo(ball.position), inBlue=ball.position.z>-8; if(i===0||d<16||inBlue)target=ball.position.clone(); else target=new THREE.Vector3(i===1?-12:12,0,-20); moveCharacterToward(e,target,5.4,dt); animateRun(e,dt,5); if(d<1.5){const dir=new THREE.Vector3(0,0,fieldLength/2).sub(ball.position).normalize(); ballVelocity.add(dir.multiplyScalar(12*dt)); if(Math.random()<.012)ballVelocity.copy(dir.multiplyScalar(23));}});}
    function moveCharacterToward(o,t,s,dt){const dir=t.clone().sub(o.position); dir.y=0; if(dir.length()<.4)return; dir.normalize(); o.position.addScaledVector(dir,s*dt); clampToField(o.position); o.rotation.y=THREE.MathUtils.lerpAngle(o.rotation.y,Math.atan2(dir.x,dir.z),.12);}
    function animateRun(o,dt,speed){o.userData.anim+=dt*speed*6; const s=Math.sin(o.userData.anim)*.18, lLeg=o.children[5], rLeg=o.children[6], lArm=o.children[3], rArm=o.children[4]; if(lLeg&&rLeg){lLeg.rotation.x=s; rLeg.rotation.x=-s;} if(lArm&&rArm){lArm.rotation.x=-s; rArm.rotation.x=s;}}
    function shootBall(power){const f=new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y)); ballVelocity.copy(f.multiplyScalar(power)); ballVelocity.y=4.8;}
    function passBall(){let best=null,bd=Infinity; blueMates.forEach(m=>{const d=m.position.distanceTo(player.position); if(d<bd){best=m;bd=d;}}); if(best){const dir=best.position.clone().sub(ball.position).normalize(); ballVelocity.copy(dir.multiplyScalar(18)); ballVelocity.y=1.6;}}
    function updateBall(dt){ball.position.addScaledVector(ballVelocity,dt); ballVelocity.multiplyScalar(.985); ballVelocity.y-=9.8*dt; if(ball.position.y<.48){ball.position.y=.48;ballVelocity.y*=-.35;} const hw=fieldWidth/2,hl=fieldLength/2+5; if(ball.position.x<-hw){ball.position.x=-hw;ballVelocity.x*=-.55;} if(ball.position.x>hw){ball.position.x=hw;ballVelocity.x*=-.55;} if(ball.position.z<-hl){ball.position.z=-hl;ballVelocity.z*=-.55;} if(ball.position.z>hl){ball.position.z=hl;ballVelocity.z*=-.55;} ball.rotation.x+=ballVelocity.z*dt*2; ball.rotation.z-=ballVelocity.x*dt*2;}
    function updateCamera(dt){const behind=new THREE.Vector3(-Math.sin(cameraYaw)*10,6.2+cameraPitch*6,-Math.cos(cameraYaw)*10), desired=player.position.clone().add(behind); camera.position.lerp(desired,.12); const look=player.position.clone(); look.y=1.8; camera.lookAt(look);}
    function checkGoal(){const inX=Math.abs(ball.position.x)<goalWidth/2, top=ball.position.z>fieldLength/2+1.5, bottom=ball.position.z<-fieldLength/2-1.5; if(inX&&top){blueScore++;goalReset('But pour Bleu !');} if(inX&&bottom){redScore++;goalReset('But pour Rouge !');}}
    function goalReset(msg){hud.textContent=`${msg}  |  Bleu ${blueScore} - ${redScore} Rouge`; ball.position.set(0,.48,0); ballVelocity.set(0,0,0); player.position.set(0,0,12); playerVelocity.set(0,0,0); aiPlayers[0].position.set(0,0,-14); aiPlayers[1].position.set(-14,0,-22); aiPlayers[2].position.set(14,0,-22); setTimeout(()=>hud.textContent=`Bleu ${blueScore} - ${redScore} Rouge`,1700);}
    function clampToField(pos){pos.x=THREE.MathUtils.clamp(pos.x,-fieldWidth/2+1,fieldWidth/2-1); pos.z=THREE.MathUtils.clamp(pos.z,-fieldLength/2+1,fieldLength/2-1); pos.y=0;}
    function onResize(){camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight);}
  </script>
</body>
</html>
