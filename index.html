<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Football 27 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#071912;color:white;font-family:Arial,Helvetica,sans-serif;touch-action:none}canvas{display:block;width:100vw;height:100vh}.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(140deg,#06111f,#087242);padding:20px}.menu h1{font-size:clamp(42px,12vw,86px);margin:0 0 8px;text-shadow:0 10px 28px #0008}.menu p{max-width:760px;opacity:.9}.row{display:grid;grid-template-columns:repeat(3,minmax(150px,1fr));gap:12px;width:min(850px,94vw);margin:16px 0}.box{text-align:left;font-weight:800}.box select{margin-top:7px;width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px}.btn{border:0;border-radius:16px;padding:15px 24px;background:#eaff56;color:#06170f;font-weight:900;font-size:18px;box-shadow:0 12px 26px #0005}.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;z-index:5;display:none;justify-content:center;gap:8px;pointer-events:none}.pill{background:#0009;border-radius:999px;padding:9px 14px;backdrop-filter:blur(8px);font-weight:800;pointer-events:auto}.mobile{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:6;display:none;justify-content:space-between;padding:0 22px;pointer-events:none}.stick{width:126px;height:126px;border-radius:50%;background:#ffffff2a;border:2px solid #ffffff55;position:relative;pointer-events:auto}.knob{width:54px;height:54px;border-radius:50%;background:#ffffffe0;position:absolute;left:36px;top:36px}.actions{display:flex;gap:12px;align-items:end;pointer-events:auto}.round{width:86px;height:86px;border-radius:50%;border:0;background:#eaff56;color:#06170f;font-weight:900}.notice{font-size:13px;opacity:.78}.hidden{display:none!important}@media(max-width:700px){.row{grid-template-columns:1fr}.pill{font-size:12px;padding:8px 10px}.round{width:78px;height:78px;font-size:12px}.stick{width:116px;height:116px}.knob{left:31px;top:31px}}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.165.0/build/three.module.js"}}</script>
</head>
<body>
<div id="menu" class="menu">
<h1>Football 27 3D</h1>
<p>Version 3D : joueurs qui courent, jambes animées, ballon qui roule, caméra dynamique, adversaires IA et tirs.</p>
<div class="row">
<label class="box">Ton pays<select id="home"></select></label>
<label class="box">Adversaire<select id="away"></select></label>
<label class="box">Difficulté<select id="diff"><option value="0.75">Facile</option><option value="1" selected>Normal</option><option value="1.25">Difficile</option></select></label>
</div>
<button id="play" class="btn">Lancer le match 3D</button>
<p class="notice">iPhone : joystick + Sprint/Tir. PC : ZQSD ou flèches, Shift, Espace.</p>
</div>
<div class="hud" id="hud"><div class="pill" id="score"></div><div class="pill" id="time">00:00</div><button class="pill" id="pause">Pause</button></div>
<div class="mobile" id="mobile"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button class="round" id="sprint">SPRINT</button><button class="round" id="shoot">TIR</button></div></div>
<canvas id="game"></canvas>
<script type="module">
import * as THREE from 'three';
const countries=[['France','🇫🇷','#2455e6'],['Brésil','🇧🇷','#f2ce31'],['Argentine','🇦🇷','#74c9ff'],['Portugal','🇵🇹','#c91d2f'],['Espagne','🇪🇸','#e5352e'],['Allemagne','🇩🇪','#eeeeee'],['Italie','🇮🇹','#198754'],['Angleterre','🏴','#eeeeee'],['Pays-Bas','🇳🇱','#ff7a1a'],['Belgique','🇧🇪','#111111'],['Croatie','🇭🇷','#d72638'],['Maroc','🇲🇦','#c91b2c'],['Sénégal','🇸🇳','#1f9c57'],['Japon','🇯🇵','#eeeeee'],['Mexique','🇲🇽','#168b50'],['États-Unis','🇺🇸','#264aa0'],['Canada','🇨🇦','#e22b31'],['Uruguay','🇺🇾','#87d8ff'],['Colombie','🇨🇴','#f5d13d'],['Norvège','🇳🇴','#d51e2f'],['Algérie','🇩🇿','#15864b'],['Irak','🇮🇶','#d3222b'],['Nigeria','🇳🇬','#14884d'],['Australie','🇦🇺','#f0cc3a']];
const homeSel=document.getElementById('home'),awaySel=document.getElementById('away');countries.forEach((c,i)=>{homeSel.add(new Option(c[1]+' '+c[0],i));awaySel.add(new Option(c[1]+' '+c[0],i));});homeSel.value=0;awaySel.value=1;
let scene,camera,renderer,clock,ball,ballV=new THREE.Vector3(),players=[],active,home,away,diff=1,scoreH=0,scoreA=0,matchTime=0,paused=false,started=false;let keys=new Set(),joy={x:0,z:0},mobileSprint=false,mobileShoot=false;
const fieldW=82,fieldD=50;
function init3D(){scene=new THREE.Scene();scene.background=new THREE.Color(0x071912);scene.fog=new THREE.Fog(0x071912,60,150);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,300);camera.position.set(-10,30,48);renderer=new THREE.WebGLRenderer({canvas:document.getElementById('game'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;clock=new THREE.Clock();scene.add(new THREE.HemisphereLight(0xeaffff,0x183320,2.2));let sun=new THREE.DirectionalLight(0xffffff,2.4);sun.position.set(-20,50,20);sun.castShadow=true;sun.shadow.camera.left=-70;sun.shadow.camera.right=70;sun.shadow.camera.top=70;sun.shadow.camera.bottom=-70;scene.add(sun);makeField();makeBall();}
function makeField(){let grass1=new THREE.MeshStandardMaterial({color:0x1f8b4d,roughness:1}),grass2=new THREE.MeshStandardMaterial({color:0x249b56,roughness:1});for(let i=0;i<10;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(fieldW/10,.25,fieldD),i%2?grass1:grass2);m.position.set(-fieldW/2+fieldW/20+i*fieldW/10,0,0);m.receiveShadow=true;scene.add(m);}line(0,0,fieldW,.16,0);line(-fieldW/2,0,.16,fieldD,0);line(fieldW/2,0,.16,fieldD,0);line(0,-fieldD/2,fieldW,.16,0);line(0,fieldD/2,fieldW,.16,0);line(0,0,.16,fieldD,0);box(-fieldW/2+5.6,0,11.2,17);box(fieldW/2-5.6,0,11.2,17);circle(0,0,7);goal(-fieldW/2-1);goal(fieldW/2+1);stands(-34);stands(34);}
function line(x,z,w,d,y){let m=new THREE.Mesh(new THREE.BoxGeometry(w,.08,d),new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(x,.22+y,z);scene.add(m)}
function box(x,z,w,d){line(x,z-d/2,w,.16,0);line(x,z+d/2,w,.16,0);line(x+(x<0?-w/2:w/2),z,.16,d,0)}
function circle(x,z,r){let pts=[];for(let i=0;i<90;i++){let a=i/89*Math.PI*2;pts.push(new THREE.Vector3(x+Math.cos(a)*r,.32,z+Math.sin(a)*r))}scene.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),new THREE.LineBasicMaterial({color:0xffffff})));}
function goal(x){let g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0xffffff}),net=new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:.18});let post=new THREE.BoxGeometry(.28,3.4,.28);let p1=new THREE.Mesh(post,mat);p1.position.set(0,1.7,-5.2);let p2=p1.clone();p2.position.z=5.2;let bar=new THREE.Mesh(new THREE.BoxGeometry(.28,.28,10.6),mat);bar.position.set(0,3.4,0);let n=new THREE.Mesh(new THREE.BoxGeometry(2.2,3,10.2),net);n.position.set(x<0?-1.1:1.1,1.5,0);g.add(p1,p2,bar,n);g.position.x=x;scene.add(g)}
function stands(z){for(let i=0;i<6;i++){let s=new THREE.Mesh(new THREE.BoxGeometry(92,1.2,2.5),new THREE.MeshStandardMaterial({color:i%2?0x123b61:0x0d2b47}));s.position.set(0,.7+i*.5,z+Math.sign(z)*i*2.8);scene.add(s)}}
function makeBall(){ball=new THREE.Mesh(new THREE.SphereGeometry(.75,32,16),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.32,metalness:.05}));ball.castShadow=true;ball.position.set(0,.85,0);scene.add(ball)}
function makePlayer(color,label,isHome,pos,index){let group=new THREE.Group();let shirt=new THREE.MeshStandardMaterial({color:new THREE.Color(color),roughness:.75}),skin=new THREE.MeshStandardMaterial({color:0xd9a06f}),dark=new THREE.MeshStandardMaterial({color:0x111111});let body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.35,4,12),shirt);body.position.y=1.75;let head=new THREE.Mesh(new THREE.SphereGeometry(.42,18,12),skin);head.position.y=2.75;let legGeo=new THREE.BoxGeometry(.23,1.05,.28);let l=new THREE.Mesh(legGeo,dark);l.position.set(-.22,.65,0);let r=l.clone();r.position.x=.22;let armGeo=new THREE.BoxGeometry(.18,.9,.22);let a1=new THREE.Mesh(armGeo,skin);a1.position.set(-.7,1.75,0);let a2=a1.clone();a2.position.x=.7;group.add(body,head,l,r,a1,a2);let name=document.createElement('canvas');name.width=256;name.height=64;let c=name.getContext('2d');c.fillStyle='white';c.font='bold 30px Arial';c.textAlign='center';c.fillText(label,128,42);let spr=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(name),transparent:true}));spr.scale.set(4,1,1);spr.position.y=3.45;group.add(spr);group.position.set(pos.x,0,pos.z);scene.add(group);return{mesh:group,isHome,home:pos.clone(),speed:isHome?11:9.5*diff,legL:l,legR:r,armL:a1,armR:a2,index,anim:0,hasBall:false}}
function teams(){players.forEach(p=>scene.remove(p.mesh));players=[];let hp=[[-30,0],[-18,-12],[-18,12],[-5,-7],[9,4],[-5,8]],ap=[[30,0],[18,-12],[18,12],[5,-7],[-9,4],[5,8]];hp.forEach((p,i)=>players.push(makePlayer(home[2],i?'CPU':'MOI',true,new THREE.Vector3(p[0],0,p[1]),i)));ap.forEach((p,i)=>players.push(makePlayer(away[2],i?'IA':'GK',false,new THREE.Vector3(p[0],0,p[1]),i)));active=players[0]}
function start(){home=countries[+homeSel.value];away=countries[+awaySel.value];diff=+document.getElementById('diff').value;if(!scene)init3D();teams();scoreH=scoreA=matchTime=0;reset();started=true;paused=false;document.getElementById('menu').classList.add('hidden');document.getElementById('hud').style.display='flex';document.getElementById('mobile').style.display='flex';clock.start();hud();requestAnimationFrame(loop)}
function input(){let x=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('q')||keys.has('a')?1:0)+joy.x;let z=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('z')||keys.has('w')?1:0)+joy.z;let v=new THREE.Vector3(x,0,z);if(v.length()>1)v.normalize();return{v,sprint:keys.has('shift')||mobileSprint,shoot:keys.has(' ')||mobileShoot}}
function loop(){if(!started)return;let dt=Math.min(clock.getDelta(),.033);if(!paused)update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}
function update(dt){matchTime+=dt*5.5;let inp=input();let speed=inp.sprint?16:11;if(inp.v.lengthSq()>.01){active.mesh.position.addScaledVector(inp.v,speed*dt);active.mesh.lookAt(active.mesh.position.clone().add(inp.v));animate(active,dt,speed)}clamp(active.mesh.position);let d=active.mesh.position.distanceTo(ball.position);if(d<2.1){active.hasBall=true;ball.position.copy(active.mesh.position).add(forward(active).multiplyScalar(1.15));ball.position.y=.85;ballV.lerp(forward(active).multiplyScalar(4),.2);if(inp.shoot){ballV.copy(forward(active).multiplyScalar(27));ballV.z+=(Math.random()-.5)*6;active.hasBall=false;mobileShoot=false;keys.delete(' ')}}else active.hasBall=false;aiMove(dt);ballMove(dt);cameraMove(dt);hud()}
function forward(p){let f=new THREE.Vector3(0,0,1);p.mesh.getWorldDirection(f);f.y=0;return f.normalize()}
function animate(p,dt,s){p.anim+=dt*s*1.8;let v=Math.sin(p.anim);p.legL.rotation.x=v*.7;p.legR.rotation.x=-v*.7;p.armL.rotation.x=-v*.55;p.armR.rotation.x=v*.55;p.mesh.position.y=Math.abs(v)*.06}
function moveTo(p,target,dt,sp){let v=new THREE.Vector3(target.x-p.mesh.position.x,0,target.z-p.mesh.position.z);let l=v.length();if(l>.35){v.normalize();p.mesh.position.addScaledVector(v,sp*dt);p.mesh.lookAt(p.mesh.position.clone().add(v));animate(p,dt,sp);clamp(p.mesh.position)}}
function aiMove(dt){let mates=players.filter(p=>p.isHome&&p!==active),opps=players.filter(p=>!p.isHome);mates.forEach((p,i)=>moveTo(p,p.home.clone().lerp(ball.position,i>2?.35:.16),dt,6.8));opps.forEach((p,i)=>{let target=p.home.clone().lerp(ball.position,i>2?.72:.38);moveTo(p,target,dt,p.speed);if(p.mesh.position.distanceTo(ball.position)<1.9){let attack=new THREE.Vector3(-41,0,(Math.random()-.5)*11).sub(p.mesh.position).normalize();ball.position.copy(p.mesh.position).add(attack.clone().multiplyScalar(1.05));ball.position.y=.85;if(Math.random()<.035*diff||p.mesh.position.x<4){ballV.copy(attack.multiplyScalar(19*diff));ballV.z+=(Math.random()-.5)*7}else{ballV.lerp(attack.multiplyScalar(7),.45)}}})}
function ballMove(dt){ball.position.addScaledVector(ballV,dt);ballV.multiplyScalar(.982);ball.rotation.x+=ballV.z*dt*1.8;ball.rotation.z-=ballV.x*dt*1.8;if(Math.abs(ball.position.z)>fieldD/2-1){ball.position.z=Math.sign(ball.position.z)*(fieldD/2-1);ballV.z*=-.65}if(ball.position.x>fieldW/2){if(Math.abs(ball.position.z)<5.3){scoreH++;reset()}else{ball.position.x=fieldW/2;ballV.x*=-.55}}if(ball.position.x<-fieldW/2){if(Math.abs(ball.position.z)<5.3){scoreA++;reset()}else{ball.position.x=-fieldW/2;ballV.x*=-.55}}}
function reset(){ball.position.set(0,.85,0);ballV.set(0,0,0);if(players.length){players.forEach(p=>{p.mesh.position.copy(p.home);p.mesh.position.y=0});active=players[0]}}
function clamp(p){p.x=Math.max(-fieldW/2+1,Math.min(fieldW/2-1,p.x));p.z=Math.max(-fieldD/2+1,Math.min(fieldD/2-1,p.z))}
function cameraMove(dt){let target=new THREE.Vector3(active.mesh.position.x*.45+ball.position.x*.3,26,38+ball.position.z*.25);camera.position.lerp(target,dt*2.6);camera.lookAt(ball.position.x*.35,0,ball.position.z*.35)}
function hud(){document.getElementById('score').textContent=home[1]+' '+home[0]+' '+scoreH+' - '+scoreA+' '+away[0]+' '+away[1];let m=String(Math.floor(matchTime/60)).padStart(2,'0'),s=String(Math.floor(matchTime%60)).padStart(2,'0');document.getElementById('time').textContent=m+':'+s}
addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));document.getElementById('play').onclick=start;document.getElementById('pause').onclick=()=>paused=!paused;
let stick=document.getElementById('stick'),knob=document.getElementById('knob'),pid=null;function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=46,l=Math.min(max,Math.hypot(dx,dy)),a=Math.atan2(dy,dx),x=Math.cos(a)*l,z=Math.sin(a)*l;knob.style.transform='translate('+x+'px,'+z+'px)';joy.x=x/max;joy.z=z/max}function stopStick(){pid=null;joy.x=joy.z=0;knob.style.transform='translate(0,0)'}stick.onpointerdown=e=>{pid=e.pointerId;stick.setPointerCapture(pid);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===pid)moveStick(e)};stick.onpointerup=stopStick;stick.onpointercancel=stopStick;document.getElementById('sprint').onpointerdown=()=>mobileSprint=true;document.getElementById('sprint').onpointerup=()=>mobileSprint=false;document.getElementById('sprint').onpointercancel=()=>mobileSprint=false;document.getElementById('shoot').onpointerdown=()=>mobileShoot=true;document.getElementById('shoot').onpointerup=()=>mobileShoot=false;document.getElementById('shoot').onpointercancel=()=>mobileShoot=false;
</script>
</body>
</html>
