<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Football 27</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#071912;color:white;font-family:Arial,Helvetica,sans-serif;touch-action:none}canvas{width:100vw;height:100vh;display:block}.menu{position:fixed;inset:0;background:linear-gradient(140deg,#07162a,#0b7a43);z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}.menu h1{font-size:58px;margin:0 0 10px}.menu p{max-width:620px;opacity:.9}.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;width:min(760px,94vw);margin:18px 0}select,button{border:0;border-radius:14px;padding:14px;font-weight:800;font-size:16px}button{background:#eaff56;color:#071912}.hud{position:fixed;top:12px;left:0;right:0;display:none;justify-content:center;gap:8px;z-index:4}.pill{background:#0009;border-radius:999px;padding:9px 13px;font-weight:800}.mobile{position:fixed;left:0;right:0;bottom:22px;display:none;justify-content:space-between;padding:0 22px;z-index:4;pointer-events:none}.stick{width:120px;height:120px;border-radius:50%;background:#ffffff2a;border:2px solid #ffffff55;position:relative;pointer-events:auto}.knob{width:52px;height:52px;border-radius:50%;background:white;position:absolute;left:34px;top:34px}.actions{display:flex;gap:12px;pointer-events:auto}.round{width:82px;height:82px;border-radius:50%;font-size:13px}.small{font-size:13px;opacity:.75}@media(max-width:700px){.row{grid-template-columns:1fr}.menu h1{font-size:44px}.pill{font-size:12px}.round{width:76px;height:76px}}
</style>
</head>
<body>
<div id="menu" class="menu">
<h1>Football 27</h1>
<p>Prototype original de foot. Pays, terrain, ballon, score, adversaire IA et commandes iPhone.</p>
<div class="row"><select id="home"></select><select id="away"></select><select id="diff"><option value="0.7">Facile</option><option value="1" selected>Normal</option><option value="1.3">Difficile</option></select></div>
<button id="play">Lancer le match</button>
<p class="small">iPhone : joystick + sprint/tir. PC : flèches ou ZQSD, Shift, Espace.</p>
</div>
<div id="hud" class="hud"><div id="score" class="pill"></div><div id="clock" class="pill">00:00</div><button id="pause" class="pill">Pause</button></div>
<div id="mobile" class="mobile"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="actions"><button id="sprint" class="round">SPRINT</button><button id="shoot" class="round">TIR</button></div></div>
<canvas id="game"></canvas>
<script>
const countries=['France','Brésil','Argentine','Portugal','Espagne','Allemagne','Italie','Angleterre','Pays-Bas','Belgique','Croatie','Maroc','Sénégal','Japon','Mexique','États-Unis','Canada','Uruguay','Colombie','Suisse','Danemark','Norvège','Suède','Pologne','Algérie','Tunisie','Égypte','Cameroun','Ghana','Nigeria','Australie','Irak','Turquie','Grèce','Ukraine','Irlande','Chili','Pérou','Jamaïque','Mali','Côte d’Ivoire','Afrique du Sud'];
const colors=['#2455e6','#f2ce31','#74c9ff','#c91d2f','#e5352e','#fff','#198754','#fff','#ff7a1a','#111','#d72638','#c91b2c','#1f9c57','#fff','#168b50','#264aa0','#e22b31','#87d8ff','#f5d13d','#e5252e','#d5212e','#d51e2f','#f4d34c','#fff','#15864b','#e62934','#d32029','#268447','#f0c43d','#14884d','#f0cc3a','#d3222b','#e52330','#4d8fe6','#f2d24c','#168c53','#d72b36','#fff','#f0ca36','#168b4d','#f1872e','#1d8043'];
const flags=['🇫🇷','🇧🇷','🇦🇷','🇵🇹','🇪🇸','🇩🇪','🇮🇹','🏴','🇳🇱','🇧🇪','🇭🇷','🇲🇦','🇸🇳','🇯🇵','🇲🇽','🇺🇸','🇨🇦','🇺🇾','🇨🇴','🇨🇭','🇩🇰','🇳🇴','🇸🇪','🇵🇱','🇩🇿','🇹🇳','🇪🇬','🇨🇲','🇬🇭','🇳🇬','🇦🇺','🇮🇶','🇹🇷','🇬🇷','🇺🇦','🇮🇪','🇨🇱','🇵🇪','🇯🇲','🇲🇱','🇨🇮','🇿🇦'];
const homeSel=document.getElementById('home'),awaySel=document.getElementById('away');countries.forEach((c,i)=>{homeSel.add(new Option(flags[i]+' '+c,c));awaySel.add(new Option(flags[i]+' '+c,c));});homeSel.value='France';awaySel.value='Brésil';
const cv=document.getElementById('game'),ctx=cv.getContext('2d');let W,H,scale=1;function resize(){W=cv.width=innerWidth*devicePixelRatio;H=cv.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);scale=Math.min(innerWidth/900,innerHeight/560);}addEventListener('resize',resize);resize();
let home='France',away='Brésil',hc='#2455e6',ac='#f2ce31',difficulty=1,scoreH=0,scoreA=0,time=0,paused=false,started=false;let ball={x:0,y:0,vx:0,vy:0};let player={x:-210,y:0,v:0};let ai={x:210,y:0};let keys={},joy={x:0,y:0},sprint=false,shoot=false;
function field(){ctx.fillStyle='#1f8b4d';ctx.fillRect(0,0,innerWidth,innerHeight);ctx.save();ctx.translate(innerWidth/2,innerHeight/2);ctx.scale(scale,scale);for(let x=-420;x<420;x+=80){ctx.fillStyle=x%160===0?'#249b56':'#1f8b4d';ctx.fillRect(x,-260,80,520)}ctx.strokeStyle='white';ctx.lineWidth=4;ctx.strokeRect(-420,-260,840,520);ctx.beginPath();ctx.moveTo(0,-260);ctx.lineTo(0,260);ctx.stroke();ctx.beginPath();ctx.arc(0,0,70,0,Math.PI*2);ctx.stroke();ctx.strokeRect(-420,-85,95,170);ctx.strokeRect(325,-85,95,170);ctx.fillStyle='#ffffff55';ctx.fillRect(-445,-70,25,140);ctx.fillRect(420,-70,25,140);ctx.restore();}
function drawPlayer(p,color,label){ctx.save();ctx.translate(innerWidth/2+p.x*scale,innerHeight/2+p.y*scale);ctx.scale(scale,scale);ctx.fillStyle='rgba(0,0,0,.25)';ctx.beginPath();ctx.ellipse(0,23,22,8,0,0,7);ctx.fill();ctx.fillStyle=color;ctx.beginPath();ctx.arc(0,0,18,0,7);ctx.fill();ctx.fillStyle='#222';ctx.fillRect(-12,15,8,24);ctx.fillRect(4,15,8,24);ctx.fillStyle='white';ctx.font='bold 20px Arial';ctx.textAlign='center';ctx.fillText(label,0,-28);ctx.restore();}
function drawBall(){ctx.save();ctx.translate(innerWidth/2+ball.x*scale,innerHeight/2+ball.y*scale);ctx.scale(scale,scale);ctx.fillStyle='white';ctx.beginPath();ctx.arc(0,0,11,0,7);ctx.fill();ctx.strokeStyle='#111';ctx.lineWidth=2;ctx.stroke();ctx.restore();}
function update(dt){time+=dt*5.5;let mx=(keys.ArrowRight||keys.d?1:0)-(keys.ArrowLeft||keys.q||keys.a?1:0)+joy.x;let my=(keys.ArrowDown||keys.s?1:0)-(keys.ArrowUp||keys.z||keys.w?1:0)+joy.y;let len=Math.hypot(mx,my)||1;mx/=len;my/=len;let sp=(sprint||keys.Shift?260:180);player.x+=mx*sp*dt;player.y+=my*sp*dt;player.x=Math.max(-390,Math.min(390,player.x));player.y=Math.max(-240,Math.min(240,player.y));let dx=ball.x-player.x,dy=ball.y-player.y;if(Math.hypot(dx,dy)<34){ball.x=player.x+28;ball.y=player.y;if(shoot||keys[' ']){ball.vx=520;ball.vy=(Math.random()-.5)*180;shoot=false;keys[' ']=false;}}
let adx=ball.x-ai.x,ady=ball.y-ai.y,al=Math.hypot(adx,ady)||1;ai.x+=adx/al*150*difficulty*dt;ai.y+=ady/al*150*difficulty*dt;if(Math.hypot(ball.x-ai.x,ball.y-ai.y)<35){ball.x=ai.x-28;ball.y=ai.y;ball.vx=-380*difficulty;ball.vy=Math.sin(time)*130;}
ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;ball.vx*=.985;ball.vy*=.985;if(Math.abs(ball.y)>245){ball.y=Math.sign(ball.y)*245;ball.vy*=-.7}if(ball.x>420){if(Math.abs(ball.y)<75){scoreH++;reset()}else{ball.x=420;ball.vx*=-.6}}if(ball.x<-420){if(Math.abs(ball.y)<75){scoreA++;reset()}else{ball.x=-420;ball.vx*=-.6}}document.getElementById('score').textContent=home+' '+scoreH+' - '+scoreA+' '+away;let m=String(Math.floor(time/60)).padStart(2,'0'),s=String(Math.floor(time%60)).padStart(2,'0');document.getElementById('clock').textContent=m+':'+s;}
function reset(){ball={x:0,y:0,vx:0,vy:0};player.x=-210;player.y=0;ai.x=210;ai.y=0;}
function loop(ts){if(!loop.last)loop.last=ts;let dt=Math.min((ts-loop.last)/1000,.033);loop.last=ts;if(started&&!paused)update(dt);field();drawPlayer(player,hc,'MOI');drawPlayer(ai,ac,'IA');drawBall();requestAnimationFrame(loop);}requestAnimationFrame(loop);
document.getElementById('play').onclick=()=>{home=homeSel.value;away=awaySel.value;hc=colors[countries.indexOf(home)];ac=colors[countries.indexOf(away)];difficulty=+document.getElementById('diff').value;scoreH=scoreA=time=0;reset();started=true;document.getElementById('menu').style.display='none';document.getElementById('hud').style.display='flex';document.getElementById('mobile').style.display='flex'};document.getElementById('pause').onclick=()=>paused=!paused;addEventListener('keydown',e=>{keys[e.key]=true;if(e.key===' ')e.preventDefault()});addEventListener('keyup',e=>keys[e.key]=false);
let stick=document.getElementById('stick'),knob=document.getElementById('knob'),pid=null;function move(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=42,l=Math.min(max,Math.hypot(dx,dy)),a=Math.atan2(dy,dx),x=Math.cos(a)*l,y=Math.sin(a)*l;knob.style.transform='translate('+x+'px,'+y+'px)';joy.x=x/max;joy.y=y/max}function stop(){pid=null;joy.x=joy.y=0;knob.style.transform='translate(0,0)'}stick.onpointerdown=e=>{pid=e.pointerId;stick.setPointerCapture(pid);move(e)};stick.onpointermove=e=>{if(e.pointerId===pid)move(e)};stick.onpointerup=stop;stick.onpointercancel=stop;document.getElementById('sprint').onpointerdown=()=>sprint=true;document.getElementById('sprint').onpointerup=()=>sprint=false;document.getElementById('shoot').onpointerdown=()=>shoot=true;document.getElementById('shoot').onpointerup=()=>shoot=false;
</script>
</body>
</html>
