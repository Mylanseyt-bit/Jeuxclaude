<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Football 3D Fixed</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#07120c;color:white;font-family:Arial;touch-action:none}#game{width:100vw;height:100vh;display:block}.menu{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(135deg,#071324,#087444);padding:20px}.menu h1{font-size:56px;margin:0 0 10px}.btn{border:0;border-radius:18px;padding:16px 28px;font-weight:900;font-size:20px;background:#eaff56;color:#06170f}.hud{position:fixed;top:12px;left:0;right:0;z-index:5;display:none;justify-content:center;gap:8px}.pill{background:#0009;border-radius:999px;padding:9px 14px;font-weight:900}.mobile{position:fixed;left:0;right:0;bottom:22px;display:none;justify-content:space-between;padding:0 22px;pointer-events:none}.joy{width:120px;height:120px;border-radius:50%;border:2px solid #fff8;background:#fff2;position:relative;pointer-events:auto}.knob{width:52px;height:52px;border-radius:50%;background:#ffffffe0;position:absolute;left:34px;top:34px}.actions{display:flex;gap:12px;align-items:end;pointer-events:auto}.round{width:78px;height:78px;border-radius:50%;border:0;background:#eaff56;font-weight:900;color:#06170f}.goal{position:fixed;top:28%;left:50%;transform:translate(-50%,-50%) scale(.5);font-size:90px;font-weight:1000;text-shadow:0 8px 30px #000;opacity:0;transition:.25s}.goal.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.warn{position:fixed;left:10px;right:10px;bottom:10px;background:#9a3412;padding:10px;border-radius:12px;white-space:pre-wrap;display:none}.hidden{display:none!important}@media(max-width:800px){.mobile{display:flex}.menu h1{font-size:44px}.round{width:72px;height:72px}}</style><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script><script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script></head><body><canvas id="game"></canvas><div id="menu" class="menu"><h1>Football 3D</h1><p>Version corrigée : le jeu démarre même si les GLB ne sont pas encore dans GitHub.</p><button id="play" class="btn">Jouer</button><p>iPhone : joystick + boutons. PC : ZQSD, Shift, Espace.</p></div><div id="hud" class="hud"><div id="score" class="pill">Score 0</div><div id="speed" class="pill">Vitesse 0</div></div><div id="goal" class="goal">BUT !</div><div id="mobile" class="mobile"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="actions"><button id="pass" class="round">PASSE</button><button id="shoot" class="round">TIR</button></div></div><div id="warn" class="warn"></div><script>const A={terrain:'assets/terrain_de_football_de_quartier.glb',ball:'assets/fifa_trionda_ball_world_cup_2026.glb',player:'assets/3d_rigged_cristiano_ronaldo_al_nassr.glb'};const $=i=>document.getElementById(i);let scene,camera,renderer,clock,loader,player,ball,score=0,started=false,keys={},joy={x:0,z:0},ballV=new THREE.Vector3(),playerV=new THREE.Vector3(),shoot=false,pass=false;function warn(t){$('warn').style.display='block';$('warn').textContent=t}function setup(){scene=new THREE.Scene();scene.background=new THREE.Color(0x071912);scene.fog=new THREE.Fog(0x071912,50,120);camera=new THREE.PerspectiveCamera(60,innerWidth/innerHeight,.1,200);renderer=new THREE.WebGLRenderer({canvas:$('game'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.8));renderer.shadowMap.enabled=true;clock=new THREE.Clock();loader=new THREE.GLTFLoader();scene.add(new THREE.HemisphereLight(0xffffff,0x23422d,1.8));let sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-25,45,20);sun.castShadow=true;scene.add(sun);pitch();goalPost(43);goalPost(-43)}function pitch(){let m1=new THREE.MeshStandardMaterial({color:0x168543}),m2=new THREE.MeshStandardMaterial({color:0x209c52});for(let i=0;i<12;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(7,.12,52),i%2?m1:m2);m.position.set(-38.5+i*7,0,0);m.receiveShadow=true;scene.add(m)}let lm=new THREE.MeshBasicMaterial({color:0xffffff});function line(x,z,w,d){let l=new THREE.Mesh(new THREE.BoxGeometry(w,.05,d),lm);l.position.set(x,.1,z);scene.add(l)}line(0,-26,84,.12);line(0,26,84,.12);line(-42,0,.12,52);line(42,0,.12,52);line(0,0,.12,52);line(36,0,.12,17);line(-36,0,.12,17)}function goalPost(x){let mat=new THREE.MeshStandardMaterial({color:0xffffff});let g=new THREE.Group();for(let z of [-5.5,5.5]){let p=new THREE.Mesh(new THREE.BoxGeometry(.18,3.4,.18),mat);p.position.set(0,1.7,z);g.add(p)}let b=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,11),mat);b.position.set(0,3.4,0);g.add(b);g.position.x=x;scene.add(g)}function glb(path){return new Promise((res,rej)=>loader.load(path,g=>res(g.scene),undefined,rej))}function fit(o,size){let box=new THREE.Box3().setFromObject(o),s=box.getSize(new THREE.Vector3()),mx=Math.max(s.x,s.y,s.z)||1;o.scale.multiplyScalar(size/mx);box.setFromObject(o);let c=box.getCenter(new THREE.Vector3());o.position.sub(c);box.setFromObject(o);o.position.y-=box.min.y;o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}})}async function models(){let miss=[];try{let t=await glb(A.terrain);fit(t,86);scene.add(t)}catch(e){miss.push('terrain')}try{player=await glb(A.player);fit(player,3.2);scene.add(player)}catch(e){miss.push('joueur');player=fallbackPlayer();scene.add(player)}try{ball=await glb(A.ball);fit(ball,1.25);scene.add(ball)}catch(e){miss.push('ballon');ball=fallbackBall();scene.add(ball)}if(miss.length)warn('Le jeu fonctionne avec modèles provisoires. GLB manquants dans GitHub assets/ : '+miss.join(', '));reset()}function fallbackPlayer(){let g=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color:0x2563eb}),skin=new THREE.MeshStandardMaterial({color:0xd6a06c});let b=new THREE.Mesh(new THREE.CylinderGeometry(.45,.55,1.5,16),mat);b.position.y=1.45;let h=new THREE.Mesh(new THREE.SphereGeometry(.35,16,12),skin);h.position.y=2.45;g.add(b,h);g.traverse(n=>{if(n.isMesh)n.castShadow=true});return g}function fallbackBall(){let b=new THREE.Mesh(new THREE.SphereGeometry(.6,32,16),new THREE.MeshStandardMaterial({color:0xffffff}));b.castShadow=true;return b}function reset(){player.position.set(0,0,-7);ball.position.set(0,.65,-3);ballV.set(0,0,0)}function forward(){return new THREE.Vector3(Math.sin(player.rotation.y),0,Math.cos(player.rotation.y))}function kick(power){if(player.position.distanceTo(ball.position)<2.5){ballV.copy(forward().multiplyScalar(power));beep();}}function beep(){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=160;g.gain.value=.07;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.stop(a.currentTime+.13)}catch(e){}}function update(dt){let x=(keys.d||keys.arrowright?1:0)-(keys.q||keys.a||keys.arrowleft?1:0)+joy.x;let z=(keys.s||keys.arrowdown?1:0)-(keys.z||keys.w||keys.arrowup?1:0)+joy.z;let v=new THREE.Vector3(x,0,z);if(v.length()>1)v.normalize();let sp=keys.shift?14:8.5;if(v.lengthSq()){playerV.lerp(v.multiplyScalar(sp),.25);player.rotation.y=Math.atan2(playerV.x,playerV.z)}else playerV.multiplyScalar(.82);player.position.addScaledVector(playerV,dt);player.position.x=Math.max(-41,Math.min(41,player.position.x));player.position.z=Math.max(-25,Math.min(25,player.position.z));if(player.position.distanceTo(ball.position)<1.4){let p=ball.position.clone().sub(player.position);p.y=0;if(p.lengthSq()<.01)p=forward();p.normalize();ballV.addScaledVector(p,9*dt)}if(shoot){kick(24);shoot=false}if(pass){kick(11);pass=false}ball.position.addScaledVector(ballV,dt);ballV.multiplyScalar(.965);ball.position.y=.65;ball.rotation.x+=ballV.z*dt*1.7;ball.rotation.z-=ballV.x*dt*1.7;if(Math.abs(ball.position.z)>25){ball.position.z=Math.sign(ball.position.z)*25;ballV.z*=-.55}if(ball.position.x>43&&Math.abs(ball.position.z)<5.8){score++;$('score').textContent='Score '+score;$('goal').classList.add('show');setTimeout(()=>$('goal').classList.remove('show'),1000);setTimeout(reset,1300)}if(Math.abs(ball.position.x)>43){ball.position.x=Math.sign(ball.position.x)*43;ballV.x*=-.55}let back=forward().multiplyScalar(-8);let want=player.position.clone().add(back);want.y=5;camera.position.lerp(want,.08);let look=player.position.clone();look.y=1.5;camera.lookAt(look);$('speed').textContent='Vitesse '+Math.round(playerV.length()*10)}function loop(){if(!started)return;let dt=Math.min(clock.getDelta(),.033);update(dt);renderer.render(scene,camera);requestAnimationFrame(loop)}$('play').onclick=async()=>{$('menu').classList.add('hidden');$('hud').style.display='flex';if(!scene){setup();await models()}started=true;clock.start();loop()};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){shoot=true;e.preventDefault()}if(e.key.toLowerCase()==='f')pass=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let joyEl=$('joy'),knob=$('knob'),pid=null;function move(e){let r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dz=e.clientY-cy,max=44,l=Math.min(max,Math.hypot(dx,dz)),a=Math.atan2(dz,dx),xx=Math.cos(a)*l,zz=Math.sin(a)*l;knob.style.transform=`translate(${xx}px,${zz}px)`;joy.x=xx/max;joy.z=zz/max}joyEl.onpointerdown=e=>{pid=e.pointerId;joyEl.setPointerCapture(pid);move(e)};joyEl.onpointermove=e=>{if(e.pointerId===pid)move(e)};joyEl.onpointerup=joyEl.onpointercancel=()=>{pid=null;joy.x=joy.z=0;knob.style.transform='translate(0,0)'};$('shoot').onpointerdown=()=>shoot=true;$('pass').onpointerdown=()=>pass=true;</script></body></html>
