<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Football 27 Pro 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#071912;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100vh}.menu{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;background:linear-gradient(140deg,#07111f,#0a7a43)}.menu h1{font-size:clamp(42px,12vw,86px);margin:0 0 10px}.menu p{max-width:760px;opacity:.92}.row{display:grid;grid-template-columns:repeat(3,minmax(145px,1fr));gap:12px;width:min(850px,94vw);margin:16px 0}.box{text-align:left;font-weight:800}.box select{margin-top:6px;width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:15px}.btn{border:0;border-radius:18px;padding:15px 24px;background:#eaff56;color:#06170f;font-weight:1000;font-size:18px}.hidden{display:none!important}.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;z-index:5;display:none;justify-content:center;gap:8px;pointer-events:none}.pill{background:#000a;border-radius:999px;padding:9px 14px;font-weight:900;pointer-events:auto}.mobile{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:6;display:none;justify-content:space-between;padding:0 22px;pointer-events:none}.stick{width:126px;height:126px;border-radius:50%;background:#ffffff2a;border:2px solid #ffffff55;position:relative;pointer-events:auto}.knob{width:54px;height:54px;border-radius:50%;background:#ffffffe0;position:absolute;left:36px;top:36px}.actions{display:flex;gap:12px;align-items:end;pointer-events:auto}.round{width:82px;height:82px;border-radius:50%;border:0;background:#eaff56;color:#06170f;font-weight:1000;font-size:12px}.warn{position:fixed;left:12px;right:12px;bottom:12px;z-index:20;background:#b45309;color:white;padding:12px;border-radius:12px;display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.stick{width:116px;height:116px}.knob{left:31px;top:31px}.round{width:74px;height:74px}}
</style>
</head>
<body>
<div id="menu" class="menu"><h1>Football 27 Pro 3D</h1><p>Version Pro : formation, tacles IA, bouton TACLE, et support des vrais fichiers GLB.</p><div class="row"><label class="box">Ton pays<select id="home"></select></label><label class="box">Adversaire<select id="away"></select></label><label class="box">Difficulté<select id="diff"><option value="0.8">Facile</option><option value="1" selected>Normal</option><option value="1.25">Difficile</option></select></label></div><button id="play" class="btn">Lancer le match 3D</button></div>
<div id="hud" class="hud"><div id="score" class="pill"></div><div id="time" class="pill">00:00</div><button id="pause" class="pill">Pause</button></div>
<div id="mobile" class="mobile"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="actions"><button id="sprint" class="round">SPRINT</button><button id="shoot" class="round">TIR</button><button id="tackle" class="round">TACLE</button></div></div>
<div id="warn" class="warn"></div><canvas id="game"></canvas>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
const $=id=>document.getElementById(id);
const countries=[['France','🇫🇷',0x2455e6],['Brésil','🇧🇷',0xf2ce31],['Argentine','🇦🇷',0x74c9ff],['Portugal','🇵🇹',0xc91d2f],['Espagne','🇪🇸',0xe5352e],['Allemagne','🇩🇪',0xeeeeee],['Italie','🇮🇹',0x198754],['Angleterre','🏴',0xffffff],['Pays-Bas','🇳🇱',0xff7a1a],['Belgique','🇧🇪',0x111111],['Maroc','🇲🇦',0xc91b2c],['Sénégal','🇸🇳',0x1f9c57]];
const homeSel=$('home'),awaySel=$('away');countries.forEach((c,i)=>{homeSel.add(new Option(c[1]+' '+c[0],i));awaySel.add(new Option(c[1]+' '+c[0],i));});homeSel.value=0;awaySel.value=1;
let scene,camera,renderer,clock,loader,ball,ballV=new THREE.Vector3(),ballOwner=null,homeTeam=[],awayTeam=[],players=[],active=null,started=false,paused=false,scoreH=0,scoreA=0,mt=0;
let home=countries[0],away=countries[1],diff=1;const FW=82,FD=50,FILES={player:'./3d_rigged_cristiano_ronaldo_al_nassr(2).glb',ball:'./fifa_trionda_ball_world_cup_2026(2).glb',terrain:'./terrain_de_football_de_quartier(2).glb'};let keys=new Set(),mobile={x:0,z:0,sprint:false,shoot:false,tackle:false};
function warn(m){$('warn').style.display='block';$('warn').textContent=m}function hideWarn(){$('warn').style.display='none'}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x071912);scene.fog=new THREE.Fog(0x071912,60,150);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,250);camera.position.set(0,25,42);renderer=new THREE.WebGLRenderer({canvas:$('game'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;clock=new THREE.Clock();loader=new GLTFLoader();scene.add(new THREE.HemisphereLight(0xeaffff,0x19301d,2.1));let sun=new THREE.DirectionalLight(0xffffff,2.1);sun.position.set(-20,44,20);sun.castShadow=true;scene.add(sun);fallbackPitch();loadTerrain();loadBall()}
function fallbackPitch(){const g1=new THREE.MeshStandardMaterial({color:0x1f8b4d,roughness:1}),g2=new THREE.MeshStandardMaterial({color:0x249b56,roughness:1});for(let i=0;i<10;i++){let s=new THREE.Mesh(new THREE.BoxGeometry(FW/10,.2,FD),i%2?g1:g2);s.position.set(-FW/2+FW/20+i*FW/10,0,0);s.receiveShadow=true;scene.add(s)}const m=new THREE.MeshBasicMaterial({color:0xffffff}),add=(x,z,w,d)=>{let o=new THREE.Mesh(new THREE.BoxGeometry(w,.05,d),m);o.position.set(x,.16,z);scene.add(o)};add(0,-FD/2,FW,.12);add(0,FD/2,FW,.12);add(-FW/2,0,.12,FD);add(FW/2,0,.12,FD);add(0,0,.12,FD);add(-35,0,.12,17);add(-38,-8.5,6,.12);add(-38,8.5,6,.12);add(35,0,.12,17);add(38,-8.5,6,.12);add(38,8.5,6,.12)}
function fit(root,size){const box=new THREE.Box3().setFromObject(root),v=box.getSize(new THREE.Vector3()),mx=Math.max(v.x,v.y,v.z)||1;root.scale.setScalar(size/mx);const c=new THREE.Box3().setFromObject(root).getCenter(new THREE.Vector3());root.position.sub(c);const b=new THREE.Box3().setFromObject(root);root.position.y-=b.min.y}
async function tryLoad(path){return await loader.loadAsync(path)}
async function loadTerrain(){try{let g=await tryLoad(FILES.terrain);fit(g.scene,90);scene.add(g.scene);hideWarn()}catch(e){warn('Jeu Pro prêt, mais les GLB ne sont pas dans le dépôt GitHub : fallback 3D utilisé.')}}
async function loadBall(){if(ball)scene.remove(ball);try{let g=await tryLoad(FILES.ball);ball=g.scene;fit(ball,1.6);scene.add(ball)}catch(e){ball=new THREE.Mesh(new THREE.SphereGeometry(.72,24,16),new THREE.MeshStandardMaterial({color:0xffffff,roughness:.35}));ball.castShadow=true;scene.add(ball)}resetBall()}
function fallbackPlayer(color){const g=new THREE.Group(),shirt=new THREE.MeshStandardMaterial({color,roughness:.7}),skin=new THREE.MeshStandardMaterial({color:0xd7a06f}),dark=new THREE.MeshStandardMaterial({color:0x111111});const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.4,4,12),shirt);body.position.y=1.7;const head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),skin);head.position.y=2.72;const legL=new THREE.Mesh(new THREE.BoxGeometry(.22,1,.25),dark);legL.position.set(-.22,.65,0);const legR=legL.clone();legR.position.x=.22;const armL=new THREE.Mesh(new THREE.BoxGeometry(.18,.85,.2),skin);armL.position.set(-.72,1.65,0);const armR=armL.clone();armR.position.x=.72;g.add(body,head,legL,legR,armL,armR);g.userData.parts={legL,legR,armL,armR};g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return g}
async function playerModel(color){try{let g=await tryLoad(FILES.player);let model=g.scene;fit(model,3.2);return model}catch(e){return fallbackPlayer(color)}}
async function makePlayer(data,isHome,color){const [x,z,role]=data;const group=await playerModel(color);group.position.set(x,0,z);scene.add(group);return{group,isHome,role,home:new THREE.Vector3(x,0,z),speed:isHome?11:9.2*diff,run:0,tackleTimer:0,hasBall:false,pressing:false}}
async function buildTeams(){for(const p of players)scene.remove(p.group);players=[];homeTeam=[];awayTeam=[];const hp=[[-32,0,'GK'],[-20,-12,'LB'],[-20,12,'RB'],[-8,-7,'CM'],[-8,7,'CM'],[10,0,'ST']],ap=[[32,0,'GK'],[20,-12,'LB'],[20,12,'RB'],[8,-7,'CM'],[8,7,'CM'],[-10,0,'ST']];for(const d of hp){let p=await makePlayer(d,true,home[2]);homeTeam.push(p);players.push(p)}for(const d of ap){let p=await makePlayer(d,false,away[2]);awayTeam.push(p);players.push(p)}active=homeTeam[5]}
function resetBall(){ball.position.set(0,.85,0);ballV.set(0,0,0);ballOwner=null}function resetPositions(){for(const p of players){p.group.position.copy(p.home);p.group.rotation.set(0,p.isHome?0:Math.PI,0);p.run=0;p.tackleTimer=0;p.hasBall=false;p.pressing=false}active=homeTeam[5];resetBall()}
function input(){let x=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('q')||keys.has('a')?1:0)+mobile.x;let z=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('z')||keys.has('w')?1:0)+mobile.z;let v=new THREE.Vector3(x,0,z);if(v.length()>1)v.normalize();return{v,sprint:keys.has('shift')||mobile.sprint,shoot:keys.has(' ')||mobile.shoot,tackle:keys.has('x')||mobile.tackle}}
function clamp(p){p.x=Math.max(-FW/2+1,Math.min(FW/2-1,p.x));p.z=Math.max(-FD/2+1,Math.min(FD/2-1,p.z))}function face(p,dir){if(dir.lengthSq()<.001)return;p.group.rotation.y=Math.atan2(dir.x,dir.z)}
function animate(p,dt,speed){p.run+=dt*speed*1.8;let s=Math.sin(p.run),parts=p.group.userData.parts;if(parts){parts.legL.rotation.x=s*.8;parts.legR.rotation.x=-s*.8;parts.armL.rotation.x=-s*.6;parts.armR.rotation.x=s*.6}p.group.position.y=Math.abs(s)*.05;if(p.tackleTimer>0){p.tackleTimer=Math.max(0,p.tackleTimer-dt);p.group.rotation.x=-0.8*(p.tackleTimer/.35)}else p.group.rotation.x=0}
function nearestTeamToBall(team){let best=team[0],dist=1e9;for(const p of team){let d=p.group.position.distanceTo(ball.position);if(d<dist){dist=d;best=p}}return best}function nearestOpponent(p){const team=p.isHome?awayTeam:homeTeam;let best=null,dist=999;for(const o of team){let d=p.group.position.distanceTo(o.group.position);if(d<dist){dist=d;best=o}}return best}
function assignPossession(){if(ballOwner&&ball.position.distanceTo(ballOwner.group.position)<2.5)return;ballOwner=null;let best=null,dist=1.8;for(const p of players){let d=p.group.position.distanceTo(ball.position);if(d<dist){dist=d;best=p}}if(best){ballOwner=best;best.hasBall=true}for(const p of players){if(p!==best)p.hasBall=false}}
function tackle(attacker,target){if(!target)return false;let d=attacker.group.position.distanceTo(target.group.position);if(d>2.4)return false;attacker.tackleTimer=.35;let success=d<1.8||Math.random()>.35;if(success){ballOwner=attacker;attacker.hasBall=true;target.hasBall=false;let dir=new THREE.Vector3().subVectors(target.group.position,attacker.group.position).normalize();ball.position.copy(attacker.group.position).add(dir.multiplyScalar(1.15));ball.position.y=.85;ballV.set(0,0,0)}return success}
function updateUser(dt){let inp=input(),speed=inp.sprint?15.5:11.2;if(inp.v.lengthSq()>.01){active.group.position.addScaledVector(inp.v,speed*dt);clamp(active.group.position);face(active,inp.v);animate(active,dt,speed)}if(ballOwner===active){let f=new THREE.Vector3(Math.sin(active.group.rotation.y),0,Math.cos(active.group.rotation.y));ball.position.copy(active.group.position).add(f.multiplyScalar(1.25));ball.position.y=.85;if(inp.shoot){ballOwner=null;active.hasBall=false;ballV.copy(f.multiplyScalar(26));ballV.z+=(Math.random()-.5)*5;mobile.shoot=false;keys.delete(' ')}}if(inp.tackle){tackle(active,nearestOpponent(active));mobile.tackle=false;keys.delete('x')}}
function teamShape(team,ballX){for(const p of team){let shift=THREE.MathUtils.clamp(ballX*.08,-3,3);p.target=p.home.clone().add(new THREE.Vector3(shift,0,0))}}
function updateTeamAI(dt,team){let presser=nearestTeamToBall(team);teamShape(team,ball.position.x);for(const p of team)p.pressing=false;if(ballOwner&&ballOwner.isHome!==team[0].isHome)presser.pressing=true;for(const p of team){let target=p.pressing?(ballOwner?ballOwner.group.position.clone():ball.position.clone()):p.target.clone();let dir=new THREE.Vector3().subVectors(target,p.group.position);dir.y=0;let dist=dir.length();if(dist>.2){dir.normalize();p.group.position.addScaledVector(dir,p.speed*dt);clamp(p.group.position);face(p,dir);animate(p,dt,p.speed)}if(ballOwner&&ballOwner.isHome!==p.isHome&&p.group.position.distanceTo(ballOwner.group.position)<2.1)tackle(p,ballOwner)}}
function updateBall(dt){if(!ballOwner){ball.position.addScaledVector(ballV,dt);ballV.multiplyScalar(.982);if(Math.abs(ball.position.z)>FD/2-1){ball.position.z=Math.sign(ball.position.z)*(FD/2-1);ballV.z*=-.7}if(ball.position.x>FW/2){if(Math.abs(ball.position.z)<5.3){scoreH++;resetPositions()}else{ball.position.x=FW/2;ballV.x*=-.6}}if(ball.position.x<-FW/2){if(Math.abs(ball.position.z)<5.3){scoreA++;resetPositions()}else{ball.position.x=-FW/2;ballV.x*=-.6}}}if(ball.rotation){ball.rotation.x+=ballV.z*dt*1.8;ball.rotation.z-=ballV.x*dt*1.8}}
function updateCamera(dt){let a=ballOwner?ballOwner.group.position:ball.position;let tp=new THREE.Vector3(a.x*.35,24,40+a.z*.22);camera.position.lerp(tp,dt*2.7);camera.lookAt(a.x*.25,0,a.z*.25)}function hud(){$('score').textContent=`${home[1]} ${home[0]} ${scoreH} - ${scoreA} ${away[0]} ${away[1]}`;let m=String(Math.floor(mt/60)).padStart(2,'0'),s=String(Math.floor(mt%60)).padStart(2,'0');$('time').textContent=`${m}:${s}`}
function loop(){if(!started)return;let dt=Math.min(clock.getDelta(),.033);if(!paused){mt+=dt*5.5;assignPossession();updateUser(dt);updateTeamAI(dt,homeTeam);updateTeamAI(dt,awayTeam);updateBall(dt);updateCamera(dt);hud()}renderer.render(scene,camera);requestAnimationFrame(loop)}
async function start(){try{if(!scene)init();home=countries[+homeSel.value];away=countries[+awaySel.value];diff=+$('diff').value;scoreH=0;scoreA=0;mt=0;await buildTeams();resetPositions();started=true;paused=false;$('menu').classList.add('hidden');$('hud').style.display='flex';$('mobile').style.display='flex';clock.start();requestAnimationFrame(loop)}catch(err){warn('Erreur au démarrage : recharge la page.');console.error(err)}}
$('play').onclick=()=>start();$('pause').onclick=()=>paused=!paused;addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key===' '||e.key.toLowerCase()==='x')e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
const stick=$('stick'),knob=$('knob');let pid=null;function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dz=e.clientY-cy,max=46,l=Math.min(max,Math.hypot(dx,dz)),a=Math.atan2(dz,dx),x=Math.cos(a)*l,z=Math.sin(a)*l;knob.style.transform=`translate(${x}px,${z}px)`;mobile.x=x/max;mobile.z=z/max}function stopStick(){pid=null;mobile.x=mobile.z=0;knob.style.transform='translate(0,0)'}stick.onpointerdown=e=>{pid=e.pointerId;stick.setPointerCapture(pid);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===pid)moveStick(e)};stick.onpointerup=stopStick;stick.onpointercancel=stopStick;$('sprint').onpointerdown=()=>mobile.sprint=true;$('sprint').onpointerup=()=>mobile.sprint=false;$('sprint').onpointercancel=()=>mobile.sprint=false;$('shoot').onpointerdown=()=>mobile.shoot=true;$('shoot').onpointerup=()=>mobile.shoot=false;$('shoot').onpointercancel=()=>mobile.shoot=false;$('tackle').onpointerdown=()=>mobile.tackle=true;$('tackle').onpointerup=()=>mobile.tackle=false;$('tackle').onpointercancel=()=>mobile.tackle=false;
</script>
</body>
