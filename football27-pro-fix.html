<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Football 27 Pro Fix</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#061912;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}#game{display:block;width:100vw;height:100vh}.menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(140deg,#06111f,#087242);padding:20px}.menu h1{font-size:clamp(42px,12vw,86px);margin:0 0 10px}.menu p{max-width:760px;opacity:.9}.row{display:grid;grid-template-columns:repeat(3,minmax(145px,1fr));gap:12px;width:min(850px,94vw);margin:16px 0}.box{text-align:left;font-weight:900}.box select{margin-top:6px;width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;font-size:15px;background:#f2f2f2;color:#111}.btn{border:0;border-radius:18px;padding:15px 24px;background:#eaff56;color:#06170f;font-weight:1000;font-size:18px}.hidden{display:none!important}.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;z-index:8;display:none;justify-content:center;gap:8px;pointer-events:none}.pill{background:#000a;border-radius:999px;padding:9px 14px;font-weight:900;pointer-events:auto}.mobile{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:9;display:none;justify-content:space-between;padding:0 22px;pointer-events:none}.stick{width:126px;height:126px;border-radius:50%;background:#ffffff2a;border:2px solid #ffffff55;position:relative;pointer-events:auto}.knob{width:54px;height:54px;border-radius:50%;background:#ffffffe0;position:absolute;left:36px;top:36px}.actions{display:flex;gap:10px;align-items:end;pointer-events:auto}.round{width:78px;height:78px;border-radius:50%;border:0;background:#eaff56;color:#06170f;font-weight:1000;font-size:11px}.warn{position:fixed;left:12px;right:12px;bottom:12px;z-index:30;background:#b45309;color:white;padding:12px;border-radius:12px;display:none}@media(max-width:700px){.row{grid-template-columns:1fr}.stick{width:116px;height:116px}.knob{left:31px;top:31px}.round{width:72px;height:72px}}
</style>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>
<div id="menu" class="menu"><h1>Football 27 Pro Fix</h1><p>Version corrigée : les pays sont disponibles directement, le bouton marche, il y a TACLE, formations et support GLB.</p><div class="row"><label class="box">Ton pays<select id="home"><option value="0">🇫🇷 France</option><option value="1">🇧🇷 Brésil</option><option value="2">🇦🇷 Argentine</option><option value="3">🇵🇹 Portugal</option><option value="4">🇪🇸 Espagne</option><option value="5">🇩🇪 Allemagne</option><option value="6">🇮🇹 Italie</option><option value="7">🏴 Angleterre</option><option value="8">🇲🇦 Maroc</option><option value="9">🇩🇿 Algérie</option></select></label><label class="box">Adversaire<select id="away"><option value="1">🇧🇷 Brésil</option><option value="0">🇫🇷 France</option><option value="2">🇦🇷 Argentine</option><option value="3">🇵🇹 Portugal</option><option value="4">🇪🇸 Espagne</option><option value="5">🇩🇪 Allemagne</option><option value="6">🇮🇹 Italie</option><option value="7">🏴 Angleterre</option><option value="8">🇲🇦 Maroc</option><option value="9">🇩🇿 Algérie</option></select></label><label class="box">Difficulté<select id="diff"><option value="0.8">Facile</option><option value="1" selected>Normal</option><option value="1.25">Difficile</option></select></label></div><button id="play" class="btn">Lancer le match 3D</button></div>
<div id="hud" class="hud"><div id="score" class="pill"></div><div id="time" class="pill">00:00</div><button id="pause" class="pill">Pause</button></div>
<div id="mobile" class="mobile"><div id="stick" class="stick"><div id="knob" class="knob"></div></div><div class="actions"><button id="sprint" class="round">SPRINT</button><button id="shoot" class="round">TIR</button><button id="tackle" class="round">TACLE</button></div></div>
<div id="warn" class="warn"></div><canvas id="game"></canvas>
<script>
const countries=[['France','🇫🇷',0x2455e6],['Brésil','🇧🇷',0xf2ce31],['Argentine','🇦🇷',0x74c9ff],['Portugal','🇵🇹',0xc91d2f],['Espagne','🇪🇸',0xe5352e],['Allemagne','🇩🇪',0xeeeeee],['Italie','🇮🇹',0x198754],['Angleterre','🏴',0xffffff],['Maroc','🇲🇦',0xc91b2c],['Algérie','🇩🇿',0x15864b]];
const $=id=>document.getElementById(id);let scene,camera,renderer,clock,loader,ball,ballV,players=[],homeTeam=[],awayTeam=[],active,owner=null,started=false,paused=false,scoreH=0,scoreA=0,t=0,home=countries[0],away=countries[1],diff=1,template=null,ballTemplate=null;let keys=new Set(),mobile={x:0,z:0,sprint:false,shoot:false,tackle:false};const FW=82,FD=50;
function warn(m){$('warn').style.display='block';$('warn').textContent=m}function hideWarn(){$('warn').style.display='none'}
function init(){scene=new THREE.Scene();scene.background=new THREE.Color(0x071912);camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.1,250);camera.position.set(0,25,42);renderer=new THREE.WebGLRenderer({canvas:$('game'),antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;clock=new THREE.Clock();loader=new THREE.GLTFLoader();scene.add(new THREE.HemisphereLight(0xffffff,0x243a28,2));let sun=new THREE.DirectionalLight(0xffffff,2);sun.position.set(-20,45,20);sun.castShadow=true;scene.add(sun);pitch();loadModels()}
function pitch(){let g1=new THREE.MeshStandardMaterial({color:0x1f8b4d}),g2=new THREE.MeshStandardMaterial({color:0x249b56});for(let i=0;i<10;i++){let m=new THREE.Mesh(new THREE.BoxGeometry(FW/10,.2,FD),i%2?g1:g2);m.position.set(-FW/2+FW/20+i*FW/10,0,0);m.receiveShadow=true;scene.add(m)}let lm=new THREE.MeshBasicMaterial({color:0xffffff});let add=(x,z,w,d)=>{let l=new THREE.Mesh(new THREE.BoxGeometry(w,.05,d),lm);l.position.set(x,.18,z);scene.add(l)};add(0,-25,82,.12);add(0,25,82,.12);add(-41,0,.12,50);add(41,0,.12,50);add(0,0,.12,50);add(-35,0,.12,17);add(-38,-8.5,6,.12);add(-38,8.5,6,.12);add(35,0,.12,17);add(38,-8.5,6,.12);add(38,8.5,6,.12);goal(-42);goal(42)}
function goal(x){let mat=new THREE.MeshStandardMaterial({color:0xffffff}),g=new THREE.Group();let p=new THREE.Mesh(new THREE.BoxGeometry(.25,3.5,.25),mat);p.position.set(0,1.75,-5.2);let p2=p.clone();p2.position.z=5.2;let b=new THREE.Mesh(new THREE.BoxGeometry(.25,.25,10.5),mat);b.position.set(0,3.5,0);g.add(p,p2,b);g.position.x=x;scene.add(g)}
function fit(o,size){let box=new THREE.Box3().setFromObject(o),s=box.getSize(new THREE.Vector3()),mx=Math.max(s.x,s.y,s.z)||1;o.scale.setScalar(size/mx);let c=new THREE.Box3().setFromObject(o).getCenter(new THREE.Vector3());o.position.sub(c);let b=new THREE.Box3().setFromObject(o);o.position.y-=b.min.y;o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true}})}
function loadModels(){loader.load('./3d_rigged_cristiano_ronaldo_al_nassr(2).glb',g=>{template=g.scene;fit(template,3.2);hideWarn()},undefined,()=>warn('Je ne trouve pas le GLB joueur dans GitHub : le jeu fonctionne avec joueur de secours.'));loader.load('./fifa_trionda_ball_world_cup_2026(2).glb',g=>{ballTemplate=g.scene;fit(ballTemplate,1.4)},undefined,()=>{});loader.load('./terrain_de_football_de_quartier(2).glb',g=>{let tr=g.scene;fit(tr,90);scene.add(tr)},undefined,()=>{})}
function fallbackPlayer(color){let gr=new THREE.Group(),mat=new THREE.MeshStandardMaterial({color}),skin=new THREE.MeshStandardMaterial({color:0xd7a06f}),dark=new THREE.MeshStandardMaterial({color:0x111111});let body=new THREE.Mesh(new THREE.CylinderGeometry(.55,.45,1.5,16),mat);body.position.y=1.6;let head=new THREE.Mesh(new THREE.SphereGeometry(.42,16,12),skin);head.position.y=2.6;let l1=new THREE.Mesh(new THREE.BoxGeometry(.22,1,.25),dark);l1.position.set(-.22,.55,0);let l2=l1.clone();l2.position.x=.22;gr.add(body,head,l1,l2);gr.userData.parts={l1,l2};gr.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true}});return gr}
function makeModel(color){let m=template?template.clone(true):fallbackPlayer(color);if(!template)m.traverse(o=>{if(o.material&&o.material.color)o.material.color.setHex(color)});return m}
function makeBall(){if(ball)scene.remove(ball);ball=ballTemplate?ballTemplate.clone(true):new THREE.Mesh(new THREE.SphereGeometry(.72,24,16),new THREE.MeshStandardMaterial({color:0xffffff}));scene.add(ball);ball.position.set(0,.85,0);ballV=new THREE.Vector3()}
function buildTeams(){players.forEach(p=>scene.remove(p.group));players=[];homeTeam=[];awayTeam=[];let hp=[[-32,0],[-20,-12],[-20,12],[-8,-7],[-8,7],[10,0]],ap=[[32,0],[20,-12],[20,12],[8,-7],[8,7],[-10,0]];hp.forEach((pos,i)=>{let p={group:makeModel(home[2]),home:new THREE.Vector3(pos[0],0,pos[1]),isHome:true,speed:11,run:0,timer:0};p.group.position.copy(p.home);scene.add(p.group);homeTeam.push(p);players.push(p)});ap.forEach((pos,i)=>{let p={group:makeModel(away[2]),home:new THREE.Vector3(pos[0],0,pos[1]),isHome:false,speed:9.5*diff,run:0,timer:0};p.group.position.copy(p.home);scene.add(p.group);awayTeam.push(p);players.push(p)});active=homeTeam[5];owner=null}
function reset(){players.forEach(p=>p.group.position.copy(p.home));owner=null;active=homeTeam[5];makeBall()}
function clamp(v){v.x=Math.max(-40,Math.min(40,v.x));v.z=Math.max(-24,Math.min(24,v.z))}function face(p,d){if(d.lengthSq()>.001)p.group.rotation.y=Math.atan2(d.x,d.z)}function animate(p,dt,sp){p.run+=dt*sp*2;let s=Math.sin(p.run);p.group.position.y=Math.abs(s)*.05;if(p.timer>0){p.timer=Math.max(0,p.timer-dt);p.group.rotation.x=-.7*(p.timer/.35)}else p.group.rotation.x=0}
function input(){let x=(keys.has('arrowright')||keys.has('d')?1:0)-(keys.has('arrowleft')||keys.has('q')||keys.has('a')?1:0)+mobile.x;let z=(keys.has('arrowdown')||keys.has('s')?1:0)-(keys.has('arrowup')||keys.has('z')||keys.has('w')?1:0)+mobile.z;let v=new THREE.Vector3(x,0,z);if(v.length()>1)v.normalize();return{v,sprint:keys.has('shift')||mobile.sprint,shoot:keys.has(' ')||mobile.shoot,tackle:keys.has('x')||mobile.tackle}}
function nearest(team,pos){let b=team[0],d=999;team.forEach(p=>{let n=p.group.position.distanceTo(pos);if(n<d){d=n;b=p}});return b}
function tackle(a,b){if(!b)return;let d=a.group.position.distanceTo(b.group.position);if(d>2.4)return;a.timer=.35;if(d<1.8||Math.random()>.35){owner=a;b.timer=.2;ball.position.copy(a.group.position);ball.position.y=.85;ballV.set(0,0,0)}}
function assign(){if(owner&&ball.position.distanceTo(owner.group.position)<2.5)return;owner=null;let b=null,d=1.8;players.forEach(p=>{let n=p.group.position.distanceTo(ball.position);if(n<d){d=n;b=p}});if(b)owner=b}
function user(dt){let inp=input(),sp=inp.sprint?15.5:11.2;if(inp.v.lengthSq()>.01){active.group.position.addScaledVector(inp.v,sp*dt);clamp(active.group.position);face(active,inp.v);animate(active,dt,sp)}if(owner===active){let f=new THREE.Vector3(Math.sin(active.group.rotation.y),0,Math.cos(active.group.rotation.y));ball.position.copy(active.group.position).add(f.multiplyScalar(1.25));ball.position.y=.85;if(inp.shoot){owner=null;ballV.copy(f.multiplyScalar(26));mobile.shoot=false;keys.delete(' ')}}if(inp.tackle){tackle(active,nearest(awayTeam,active.group.position));mobile.tackle=false;keys.delete('x')}}
function aiTeam(team){let press=nearest(team,ball.position);team.forEach(p=>{let target=p.home.clone().add(new THREE.Vector3(THREE.MathUtils.clamp(ball.position.x*.08,-3,3),0,0));if(owner&&owner.isHome!==p.isHome&&p===press)target=owner.group.position.clone();let d=new THREE.Vector3().subVectors(target,p.group.position);d.y=0;if(d.length()>.2){d.normalize();p.group.position.addScaledVector(d,p.speed*.033);clamp(p.group.position);face(p,d);animate(p,.033,p.speed)}if(owner&&owner.isHome!==p.isHome&&p.group.position.distanceTo(owner.group.position)<2.1)tackle(p,owner)})}
function ballMove(dt){if(!owner){ball.position.addScaledVector(ballV,dt);ballV.multiplyScalar(.982);if(Math.abs(ball.position.z)>24){ball.position.z=Math.sign(ball.position.z)*24;ballV.z*=-.7}if(ball.position.x>41){if(Math.abs(ball.position.z)<5.3){scoreH++;reset()}else{ball.position.x=41;ballV.x*=-.6}}if(ball.position.x<-41){if(Math.abs(ball.position.z)<5.3){scoreA++;reset()}else{ball.position.x=-41;ballV.x*=-.6}}}ball.rotation.x+=ballV.z*dt*1.8;ball.rotation.z-=ballV.x*dt*1.8}
function cam(dt){let a=owner?owner.group.position:ball.position;camera.position.lerp(new THREE.Vector3(a.x*.35,24,40+a.z*.22),dt*2.7);camera.lookAt(a.x*.25,0,a.z*.25)}function hud(){$('score').textContent=`${home[1]} ${home[0]} ${scoreH} - ${scoreA} ${away[0]} ${away[1]}`;let m=String(Math.floor(t/60)).padStart(2,'0'),s=String(Math.floor(t%60)).padStart(2,'0');$('time').textContent=m+':'+s}
function loop(){if(!started)return;let dt=Math.min(clock.getDelta(),.033);if(!paused){t+=dt*5.5;assign();user(dt);aiTeam(homeTeam);aiTeam(awayTeam);ballMove(dt);cam(dt);hud()}renderer.render(scene,camera);requestAnimationFrame(loop)}
async function startGame(){if(!window.THREE){warn('La 3D ne charge pas. Ouvre dans Safari/Chrome.');return}if(!scene)init();home=countries[+$('home').value];away=countries[+$('away').value];diff=+$('diff').value;scoreH=scoreA=t=0;buildTeams();reset();started=true;paused=false;$('menu').classList.add('hidden');$('hud').style.display='flex';$('mobile').style.display='flex';clock.start();requestAnimationFrame(loop)}
$('play').onclick=startGame;$('pause').onclick=()=>paused=!paused;addEventListener('keydown',e=>{keys.add(e.key.toLowerCase());if(e.key===' '||e.key.toLowerCase()==='x')e.preventDefault()});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('resize',()=>{if(!renderer)return;camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});let stick=$('stick'),knob=$('knob'),pid=null;function moveStick(e){let r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dz=e.clientY-cy,max=46,l=Math.min(max,Math.hypot(dx,dz)),a=Math.atan2(dz,dx),x=Math.cos(a)*l,z=Math.sin(a)*l;knob.style.transform=`translate(${x}px,${z}px)`;mobile.x=x/max;mobile.z=z/max}function stop(){pid=null;mobile.x=mobile.z=0;knob.style.transform='translate(0,0)'}stick.onpointerdown=e=>{pid=e.pointerId;stick.setPointerCapture(pid);moveStick(e)};stick.onpointermove=e=>{if(e.pointerId===pid)moveStick(e)};stick.onpointerup=stop;stick.onpointercancel=stop;$('sprint').onpointerdown=()=>mobile.sprint=true;$('sprint').onpointerup=()=>mobile.sprint=false;$('shoot').onpointerdown=()=>mobile.shoot=true;$('shoot').onpointerup=()=>mobile.shoot=false;$('tackle').onpointerdown=()=>mobile.tackle=true;$('tackle').onpointerup=()=>mobile.tackle=false;
</script></body></html>
