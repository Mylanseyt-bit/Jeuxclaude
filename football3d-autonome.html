<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>Football 3D Autonome</title><style>html,body{margin:0;height:100%;overflow:hidden;background:#06120b;color:#fff;font-family:Arial,Helvetica,sans-serif;touch-action:none}#c{position:fixed;inset:0;width:100vw;height:100vh;display:block;background:#06120b}.menu{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;background:linear-gradient(145deg,#071423,#087344);padding:22px}.menu h1{font-size:52px;margin:0 0 8px}.menu p{max-width:520px;line-height:1.4;opacity:.9}.btn{border:0;border-radius:18px;padding:17px 30px;background:#eaff56;color:#07170f;font-weight:1000;font-size:21px}.hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:0;right:0;z-index:9;display:none;justify-content:center;gap:8px}.pill{background:#0009;border:1px solid #fff2;border-radius:999px;padding:9px 13px;font-weight:900}.mobile{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:10;display:none;justify-content:space-between;padding:0 20px;pointer-events:none}.joy{width:118px;height:118px;border-radius:50%;background:#fff2;border:2px solid #fff8;position:relative;pointer-events:auto}.knob{width:52px;height:52px;border-radius:50%;background:#ffffffe8;position:absolute;left:33px;top:33px}.actions{display:flex;gap:12px;align-items:end;pointer-events:auto}.round{width:76px;height:76px;border:0;border-radius:50%;background:#eaff56;color:#07170f;font-weight:1000}.goal{position:fixed;left:50%;top:28%;z-index:12;transform:translate(-50%,-50%) scale(.5);font-size:86px;font-weight:1000;text-shadow:0 10px 35px #000;opacity:0;transition:.25s}.goal.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.hidden{display:none!important}@media(max-width:850px){.mobile{display:flex}.menu h1{font-size:42px}.round{width:72px;height:72px}}</style></head><body><canvas id="c"></canvas><div id="menu" class="menu"><h1>Football 3D</h1><p>Version autonome iPhone : aucun chargement externe, donc le bouton Jouer fonctionne directement. C’est une base jouable en style 3D/isométrique.</p><button id="play" class="btn">Jouer</button><p>iPhone : joystick + Tir/Passe. PC : ZQSD, Shift, Espace, F.</p></div><div id="hud" class="hud"><div id="score" class="pill">Score 0 - 0</div><div id="speed" class="pill">Vitesse 0</div></div><div id="goal" class="goal">BUT !</div><div id="mobile" class="mobile"><div id="joy" class="joy"><div id="knob" class="knob"></div></div><div class="actions"><button id="pass" class="round">PASSE</button><button id="shoot" class="round">TIR</button></div></div><script>const c=document.getElementById('c'),x=c.getContext('2d'),$=i=>document.getElementById(i);let W=0,H=0,started=false,last=0,score=0,shake=0;let keys={},joy={x:0,z:0},shoot=false,pass=false;let player={x:0,z:-8,vx:0,vz:0,a:0,run:0},ball={x:0,z:-3,vx:0,vz:0,r:.72};function resize(){W=c.width=innerWidth*devicePixelRatio;H=c.height=innerHeight*devicePixelRatio;x.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0)}resize();addEventListener('resize',resize);function iso(px,pz,py=0){let s=Math.min(innerWidth/95,innerHeight/60)*1.35,ox=innerWidth/2,oy=innerHeight*.55;return{x:ox+(px-pz)*s*.72,y:oy+(px+pz)*s*.32-py*s}}function field(){let pts=[iso(-43,-26),iso(43,-26),iso(43,26),iso(-43,26)];x.fillStyle='#147a3d';x.beginPath();pts.forEach((p,i)=>i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y));x.closePath();x.fill();for(let i=-42;i<42;i+=7){let a=iso(i,-26),b=iso(i+7,-26),cc=iso(i+7,26),d=iso(i,26);x.fillStyle=(Math.round(i/7)%2?'#1f914e':'#198545');x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.lineTo(cc.x,cc.y);x.lineTo(d.x,d.y);x.closePath();x.fill()}line(-43,-26,43,-26);line(43,-26,43,26);line(43,26,-43,26);line(-43,26,-43,-26);line(0,-26,0,26);rectLine(33,-9,43,9);rectLine(-43,-9,-33,9);circle(0,0,6)}function line(ax,az,bx,bz){let a=iso(ax,az),b=iso(bx,bz);x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}function rectLine(ax,az,bx,bz){line(ax,az,bx,az);line(bx,az,bx,bz);line(bx,bz,ax,bz)}function circle(cx,cz,r){x.strokeStyle='#fff';x.lineWidth=2;x.beginPath();for(let i=0;i<=64;i++){let a=i/64*Math.PI*2,p=iso(cx+Math.cos(a)*r,cz+Math.sin(a)*r);if(i)x.lineTo(p.x,p.y);else x.moveTo(p.x,p.y)}x.stroke()}function goalpost(gx){let p1=iso(gx,-5.8),p2=iso(gx,5.8),top1=iso(gx,-5.8,3),top2=iso(gx,5.8,3);x.strokeStyle='#fff';x.lineWidth=5;x.beginPath();x.moveTo(p1.x,p1.y);x.lineTo(top1.x,top1.y);x.lineTo(top2.x,top2.y);x.lineTo(p2.x,p2.y);x.stroke()}function shadow(o,r){let p=iso(o.x,o.z);x.fillStyle='rgba(0,0,0,.28)';x.beginPath();x.ellipse(p.x,p.y+7,r*1.5,r*.55,0,0,Math.PI*2);x.fill()}function drawBall(){shadow(ball,8);let p=iso(ball.x,ball.z,.8);let g=x.createRadialGradient(p.x-4,p.y-5,2,p.x,p.y,12);g.addColorStop(0,'#fff');g.addColorStop(1,'#cfd6df');x.fillStyle=g;x.beginPath();x.arc(p.x,p.y,11,0,Math.PI*2);x.fill();x.strokeStyle='#111';x.lineWidth=1.5;x.beginPath();x.arc(p.x,p.y,5,0,Math.PI*2);x.moveTo(p.x-10,p.y);x.lineTo(p.x+10,p.y);x.moveTo(p.x,p.y-10);x.lineTo(p.x,p.y+10);x.stroke()}function drawPlayer(){shadow(player,12);let p=iso(player.x,player.z,0),head=iso(player.x,player.z,3);x.save();x.translate(p.x,p.y);x.fillStyle='#1559ff';x.beginPath();x.roundRect(-12,-48,24,34,7);x.fill();let leg=Math.sin(player.run)*8;x.strokeStyle='#111';x.lineWidth=6;x.beginPath();x.moveTo(-7,-14);x.lineTo(-9+leg,5);x.moveTo(7,-14);x.lineTo(9-leg,5);x.stroke();x.strokeStyle='#ffd0a0';x.beginPath();x.moveTo(-12,-40);x.lineTo(-24,-28-leg*.5);x.moveTo(12,-40);x.lineTo(24,-28+leg*.5);x.stroke();x.restore();x.fillStyle='#d99b67';x.beginPath();x.arc(head.x,head.y-12,13,0,Math.PI*2);x.fill();x.fillStyle='#111';x.beginPath();x.arc(head.x,head.y-22,10,Math.PI,0);x.fill()}function update(dt){let ix=(keys.d||keys.arrowright?1:0)-(keys.q||keys.a||keys.arrowleft?1:0)+joy.x, iz=(keys.s||keys.arrowdown?1:0)-(keys.z||keys.w||keys.arrowup?1:0)+joy.z;let l=Math.hypot(ix,iz)||1;if(l>1){ix/=l;iz/=l}let sp=keys.shift?15:9;player.vx+=(ix*sp-player.vx)*.18;player.vz+=(iz*sp-player.vz)*.18;player.x+=player.vx*dt;player.z+=player.vz*dt;player.x=Math.max(-41,Math.min(41,player.x));player.z=Math.max(-24,Math.min(24,player.z));if(Math.hypot(player.vx,player.vz)>.2){player.a=Math.atan2(player.vx,player.vz);player.run+=dt*15}let dx=ball.x-player.x,dz=ball.z-player.z,d=Math.hypot(dx,dz);if(d<1.75){dx/=d||1;dz/=d||1;ball.vx+=dx*18*dt;ball.vz+=dz*18*dt}let fx=Math.sin(player.a),fz=Math.cos(player.a);if(shoot&&d<3){ball.vx=fx*28;ball.vz=fz*28;shoot=false;shake=.4;beep()}if(pass&&d<3){ball.vx=fx*13;ball.vz=fz*13;pass=false;beep()}shoot=false;pass=false;ball.x+=ball.vx*dt;ball.z+=ball.vz*dt;ball.vx*=Math.pow(.965,dt*60);ball.vz*=Math.pow(.965,dt*60);if(Math.abs(ball.z)>24.5){ball.z=Math.sign(ball.z)*24.5;ball.vz*=-.55}if(ball.x>43&&Math.abs(ball.z)<6){score++;$('score').textContent='Score '+score+' - 0';$('goal').classList.add('show');shake=1;setTimeout(()=>$('goal').classList.remove('show'),900);setTimeout(()=>{ball.x=0;ball.z=-3;ball.vx=ball.vz=0;player.x=0;player.z=-8},1200)}if(Math.abs(ball.x)>43){ball.x=Math.sign(ball.x)*43;ball.vx*=-.55}$('speed').textContent='Vitesse '+Math.round(Math.hypot(player.vx,player.vz)*10)}function draw(){x.clearRect(0,0,innerWidth,innerHeight);if(shake>0){x.save();x.translate((Math.random()-.5)*shake*12,(Math.random()-.5)*shake*12);shake*=.92}let sky=x.createLinearGradient(0,0,0,innerHeight);sky.addColorStop(0,'#071827');sky.addColorStop(1,'#07120b');x.fillStyle=sky;x.fillRect(-20,-20,innerWidth+40,innerHeight+40);field();goalpost(-43);goalpost(43);if(player.z<ball.z){drawPlayer();drawBall()}else{drawBall();drawPlayer()}if(shake>0)x.restore()}function loop(t){if(!started)return;let dt=Math.min((t-last)/1000,.033);last=t;update(dt);draw();requestAnimationFrame(loop)}function beep(){try{let a=new AudioContext(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.frequency.value=150;g.gain.value=.06;o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.12);o.stop(a.currentTime+.13)}catch(e){}}$('play').onclick=()=>{started=true;$('menu').classList.add('hidden');$('hud').style.display='flex';last=performance.now();requestAnimationFrame(loop)};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(e.code==='Space'){shoot=true;e.preventDefault()}if(e.key.toLowerCase()==='f')pass=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);$('shoot').onpointerdown=()=>shoot=true;$('pass').onpointerdown=()=>pass=true;let j=$('joy'),k=$('knob'),pid=null;function jm(e){let r=j.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dz=e.clientY-cy,max=42,ll=Math.min(max,Math.hypot(dx,dz)),a=Math.atan2(dz,dx),xx=Math.cos(a)*ll,zz=Math.sin(a)*ll;k.style.transform=`translate(${xx}px,${zz}px)`;joy.x=xx/max;joy.z=zz/max}j.onpointerdown=e=>{pid=e.pointerId;j.setPointerCapture(pid);jm(e)};j.onpointermove=e=>{if(e.pointerId===pid)jm(e)};j.onpointerup=j.onpointercancel=()=>{pid=null;joy.x=joy.z=0;k.style.transform='translate(0,0)'};</script></body></html>
